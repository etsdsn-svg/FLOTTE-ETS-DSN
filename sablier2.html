/* ================= 13. RAPPORTS ================= */
function bornes(per,ancre){
  if(per==="semaine"){ const l=lundiDe(ancre);
    return {d1:l,d2:ajoutJours(l,6),titre:"Semaine "+numSemaine(l)+" · "+new Date(l+"T00:00:00").getFullYear()}; }
  const x=new Date(ancre+"T00:00:00");
  if(per==="mois") return {
    d1:isoLocal(new Date(x.getFullYear(),x.getMonth(),1)),
    d2:isoLocal(new Date(x.getFullYear(),x.getMonth()+1,0)),
    titre:MOIS[x.getMonth()][0].toUpperCase()+MOIS[x.getMonth()].slice(1)+" "+x.getFullYear()};
  return {d1:x.getFullYear()+"-01-01",d2:x.getFullYear()+"-12-31",titre:"Année "+x.getFullYear()};
}
window.decaler = n => {
  const per=etatVue.periode||"semaine";
  const x=new Date((etatVue.ancre||auj())+"T00:00:00");
  if(per==="semaine") x.setDate(x.getDate()+7*n);
  else if(per==="mois") x.setMonth(x.getMonth()+n);
  else x.setFullYear(x.getFullYear()+n);
  etatVue.ancre=isoLocal(x); rendu();
};
/* Ce qui restait en caisse la veille du debut de periode : le report. */
function soldeAu(dateLimite){
  let s=0;
  for(const m of D.mouvements){
    if(m.date > dateLimite) continue;
    s += (m.sens==="entree" ? 1 : -1) * (Number(m.montant)||0);
  }
  return s;
}
const clotureDe = (per,d1) => (D.clotures||[]).find(c => c.periode===per && c.d1===d1) || null;

function totaux(d1,d2){
  const t={recettes:0,dg:0,ouv:0,pieces:0,mo:0,externes:0,nbPannes:0,prog:0,imp:0};
  for(const m of D.mouvements){
    if(m.date<d1||m.date>d2) continue;
    const v=Number(m.montant)||0;
    if(m.sens==="entree"){ if(m.source==="dg") t.dg+=v; else if(m.source==="ouverture") t.ouv+=v; else t.recettes+=v; }
    else if(m.nature!=="flotte") t.externes+=v;
  }
  for(const p of D.pannes){
    if(p.statut!=="payee"||p.date_paiement<d1||p.date_paiement>d2) continue;
    t.pieces+=Number(p.cout_pieces)||0; t.mo+=Number(p.cout_mo)||0; t.nbPannes++;
    if(p.nature==="programmee") t.prog++; else t.imp++;
  }
  t.flotte=t.pieces+t.mo; t.entrees=t.recettes+t.dg+t.ouv;
  t.sorties=t.flotte+t.externes; t.resultat=t.entrees-t.sorties;
  t.reporte = soldeAu(ajoutJours(d1,-1));
  t.disponible = t.reporte + t.entrees;
  t.soldeFin = t.disponible - t.sorties;
  return t;
}

/* Une periode close affiche ses chiffres figes, pas ceux recalcules. */
function totauxFiges(c){
  const t = { reporte:Number(c.solde_ouverture)||0, recettes:Number(c.recettes)||0,
    dg:Number(c.apports_dg)||0, ouv:Number(c.ouverture_caisse)||0,
    pieces:Number(c.flotte_pieces)||0, mo:Number(c.flotte_mo)||0,
    externes:Number(c.externes)||0, nbPannes:c.nb_interventions||0,
    prog:c.nb_programmees||0, imp:c.nb_imprevues||0 };
  t.flotte=t.pieces+t.mo; t.entrees=t.recettes+t.dg+t.ouv;
  t.sorties=t.flotte+t.externes; t.resultat=t.entrees-t.sorties;
  t.disponible=t.reporte+t.entrees; t.soldeFin=Number(c.solde_cloture)||0;
  return t;
}

let C = null;   /* données du chauffeur */

let enAttenteFile = [];
async function chargerChauffeur(){
  await viderFile(true).catch(()=>{});
  try{ enAttenteFile = await fileLire(); }catch(e){ enAttenteFile = []; }
  const [cam, pan, gar, med, msg] = await Promise.all([
    sb.from("sb2_camions").select("*"),
    tout(o => sb.from("sb2_pannes").select("*", o).order("date_signalement",{ascending:false})),
    sb.from("sb2_garages").select("id,nom,ville"),
    tout(o => sb.from("sb2_medias").select("panne_id,genre", o)),
    tout(o => sb.from("sb2_messages").select("id,panne_id,expediteur_role,lu_admin,lu_chauffeur,lu_garage", o))
  ]);
  const e=[cam,pan,gar].find(r=>r.error);
  if(e) throw new Error(e.error.message);
  C = { camions:cam.data||[], pannes:pan.data||[], garages:gar.data||[], medias:med.data||[],
        messages:msg.data||[], documents:[] };
  /* Statut des documents administratifs de son camion — jamais un montant :
     la fonction serveur ne renvoie que l'échéance et l'état. */
  if(C.camions[0]){
    try{
      const { data, error } = await sb.rpc("sb2_documents_camion", { p_camion: C.camions[0].id });
      if(!error) C.documents = data || [];
    }catch(e){ C.documents = []; }
  }
}

async function ajouterPiece(fichier, genre){
  if(!fichier) return;
  msgMod("");
  let blob=fichier, duree=null;
  if(genre==="photo") blob=await compresser(fichier);
  if(genre==="video"){
    duree=await dureeVideo(fichier);
    if(duree>12) return msgMod(`Cette vidéo dure ${duree.toFixed(0)} secondes. Refaites-en une de 10 secondes maximum.`,"ocre");
  }
  if(blob.size>10*1024*1024)
    return msgMod("Ce fichier dépasse 10 Mo. Prenez une photo à la place, c'est bien plus léger.","ocre");
  piecesAjoutees.push({blob, genre, duree});
  listerPiecesAjoutees();
}

let microMod=null, morceauxMod=[];
window.basculerAudioMod = async () => {
  if(microMod && microMod.state==="recording"){ microMod.stop(); return; }
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==="undefined"){
    document.getElementById("md-audio").click(); return;
  }
  try{
    const flux=await navigator.mediaDevices.getUserMedia({audio:true});
    microMod=new MediaRecorder(flux); morceauxMod=[];
    microMod.ondataavailable=e=>morceauxMod.push(e.data);
    afficherBarreEnregistrement("md-rang", flux, "basculerAudioMod");
    microMod.onstop=async()=>{
      flux.getTracks().forEach(t=>t.stop());
      masquerBarreEnregistrement("md-rang");
      const blob=new Blob(morceauxMod,{type:microMod.mimeType||"audio/webm"});
      if(blob.size>0){ piecesAjoutees.push({blob,genre:"audio",duree:null}); listerPiecesAjoutees(); }
    };
    microMod.start();
    setTimeout(()=>{ if(microMod && microMod.state==="recording") microMod.stop(); }, 30000);
  }catch(e){ document.getElementById("md-audio").click(); }
};

window.enregistrerModification = async (panneId) => {
  const desc = val("md-desc").trim();
  if(!desc && !piecesAjoutees.length) return msgMod("Décrivez la panne, ou joignez une photo.","ocre");
  if(!navigator.onLine) return msgMod("Pas de réseau. Réessayez dès que vous captez.","ocre");

  const b = document.getElementById("md-envoyer");
  b.disabled = true; b.textContent = "Envoi…";
  const arret = valSegm("md-roule") === "0";

  const maj = { description: desc, immobilise: arret };
  const p = C.pannes.find(x => x.id === panneId);
  if(arret && !p.immob_debut) maj.immob_debut = auj();
  if(!arret) maj.immob_debut = null;

  const { error } = await sb.from("sb2_pannes").update(maj).eq("id", panneId);
  if(error){
    b.disabled = false; b.textContent = "Enregistrer";
    return msgMod("Modification impossible. La panne est peut-être déjà partie au garage.","rouge");
  }

  let ratés = 0;
  for(const f of piecesAjoutees){
    try{

      const up = await sb.storage.from("sb2-medias").upload(chemin, f.blob, {contentType:f.blob.type});
      if(up.error) throw up.error;
      await sb.from("sb2_medias").insert({panne_id:panneId, genre:f.genre,
        chemin, taille:f.blob.size, duree_s:f.duree||null});
    }catch(e){ ratés++; }
  }

  fermer();
  toast(ratés ? `Modifié, mais ${ratés} pièce${ratés>1?"s":""} non envoyée${ratés>1?"s":""}.`
              : "Signalement mis à jour.");
  await recharger();
};

/* --- Barre d'enregistrement audio (timer + onde réactive au micro) ---
   Partagée entre le premier signalement (sg-) et sa modification (md-) :
   remplace temporairement la rangée d'icônes par une barre façon
   messagerie, puis restaure la rangée d'origine à l'arrêt. */
let ondeMinuteur = null, ondeArret = null;
function afficherBarreEnregistrement(rangId, flux, nomFonctionArret){
  const rang = document.getElementById(rangId);
  if(!rang) return;
  rang.dataset.avant = rang.innerHTML;
  const barres = Array.from({length:20}, () => "<i></i>").join("");
  rang.innerHTML = `<div class="rec-bar">
    <span class="rec-dot"></span>
    <span class="rec-time" id="${rangId}-time">0:00</span>
    <div class="rec-wave" id="${rangId}-wave">${barres}</div>
    <button class="rec-stop" onclick="${nomFonctionArret}()" aria-label="Arrêter l'enregistrement">
      <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
    </button></div>`;

  const debut = Date.now();
  ondeMinuteur = setInterval(() => {
    const s = Math.floor((Date.now()-debut)/1000);
    const t = document.getElementById(rangId+"-time");
    if(t) t.textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  }, 250);

  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const source = ctx.createMediaStreamSource(flux);
    const analyseur = ctx.createAnalyser();
    analyseur.fftSize = 64;
    source.connect(analyseur);
    const data = new Uint8Array(analyseur.frequencyBinCount);
    const barresEl = rang.querySelectorAll("#"+rangId+"-wave i");
    let raf;
    (function boucle(){
      analyseur.getByteFrequencyData(data);
      barresEl.forEach((b,i)=>{
        const v = data[Math.floor(i*data.length/barresEl.length)] || 0;
        b.style.height = Math.max(3, Math.round((v/255)*22))+"px";
      });
      raf = requestAnimationFrame(boucle);
    })();
    ondeArret = () => { cancelAnimationFrame(raf); ctx.close().catch(()=>{}); };
  }catch(e){ ondeArret = null; }
}
function masquerBarreEnregistrement(rangId){
  clearInterval(ondeMinuteur); ondeMinuteur = null;
  if(ondeArret){ ondeArret(); ondeArret = null; }
  const rang = document.getElementById(rangId);
  if(rang && rang.dataset.avant != null){ rang.innerHTML = rang.dataset.avant; delete rang.dataset.avant; }
}

/* Photo : on réduit avant d'envoyer. 4 Mo deviennent ~300 Ko. */
function compresser(fichier){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(fichier);
    img.onload=()=>{
      const max=1600, r=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{ URL.revokeObjectURL(url); res(b||fichier); },"image/jpeg",0.75);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(fichier); };
    img.src=url;
  });
}
function dureeVideo(fichier){
  return new Promise(res=>{
    const v=document.createElement("video"), url=URL.createObjectURL(fichier);
    v.preload="metadata";
    v.onloadedmetadata=()=>{ URL.revokeObjectURL(url); res(v.duration||0); };
    v.onerror=()=>{ URL.revokeObjectURL(url); res(0); };
    v.src=url;
  });
}
async function ajouterFichier(fichier, genre, maxVideo){
  if(!fichier) return;
  msgSg("");
  const limite = maxVideo || 12;
  let blob=fichier, duree=null;
  if(genre==="photo") blob=await compresser(fichier);
  if(genre==="video"){
    duree=await dureeVideo(fichier);
    if(duree>limite) return msgSg(`Cette vidéo dure ${duree.toFixed(0)} secondes. Maximum ${limite} secondes.`,"ocre");
  }
  if(blob.size>10*1024*1024)
    return msgSg("Ce fichier dépasse 10 Mo. Prenez une photo à la place, c'est bien plus léger.","ocre");
  piecesJointes.push({blob, genre, duree, nom:fichier.name||genre});
  listerPieces();
}

/* Audio : enregistrement direct, avec repli sur le micro du téléphone. */
let micro=null, morceaux=[];
window.basculerAudio = async () => {
  if(micro && micro.state==="recording"){ micro.stop(); return; }
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==="undefined"){
    document.getElementById("sg-audio").click(); return;
  }
  try{
    const flux=await navigator.mediaDevices.getUserMedia({audio:true});
    micro=new MediaRecorder(flux); morceaux=[];
    micro.ondataavailable=e=>morceaux.push(e.data);
    afficherBarreEnregistrement("sg-rang", flux, "basculerAudio");
    micro.onstop=async()=>{
      flux.getTracks().forEach(t=>t.stop());
      masquerBarreEnregistrement("sg-rang");
      const blob=new Blob(morceaux,{type:micro.mimeType||"audio/webm"});
      if(blob.size>0){ piecesJointes.push({blob,genre:"audio",duree:null,nom:"audio"}); listerPieces(); }
    };
    micro.start();
    setTimeout(()=>{ if(micro && micro.state==="recording") micro.stop(); }, 30000);
  }catch(e){ document.getElementById("sg-audio").click(); }
};

window.envoyerSignalement = async () => {

    statut:"signalee", nature:"imprevue", description:desc,

  }).select().single();

    "Réseau instable. Votre signalement est gardé et repartira tout seul.");

      await sb.from("sb2_medias").insert({panne_id:data.id, genre:f.genre,
        chemin, taille:f.blob.size, duree_s:f.duree||null});
    }catch(e){ ratés++; }
  }

  fermer();
  toast(ratés ? `Panne signalée, mais ${ratés} pièce${ratés>1?"s":""} non envoyée${ratés>1?"s":""}.`
              : "Panne signalée. SARANA est prévenu.");
  prevenir(data.id, "panne_signalee");
  await recharger();
};

let G = null;

async function chargerGarage(){
  const [cam, pan, med, ch, msg] = await Promise.all([

const camionG = id => (G.camions.find(c=>c.id===id)||{}).nom || "Camion";
const modeleG = id => (G.camions.find(c=>c.id===id)||{}).modele || "";
const chauffeurG = id => (G.chauffeurs.find(c=>c.id===id)||{}).nom || "";
const depuis = t => {
  if(!t) return "";
  const j = Math.floor((Date.now()-new Date(t).getTime())/86400000);
  const hr = Math.floor((Date.now()-new Date(t).getTime())/3600000);
  return j >= 1 ? `depuis ${j} jour${j>1?"s":""}` : `depuis ${hr} h`;
};

/* Le garage pointe qu'il a été payé.
   Ce n'est PAS l'enregistrement du paiement : la sortie de caisse reste
   déclenchée par la direction seule. C'est un signal, que la direction
   voit et vérifie. Le garage n'a aucun droit d'écriture sur sb2_pannes ;
   il appelle une fonction SQL qui ne sait toucher qu'à cette case. */
window.pointerPaiement = async (panneId, boite) => {
  const avant = !boite.checked;          /* pour revenir en arrière si ça rate */
  boite.disabled = true;
  const { error } = await sb.rpc("sb2_garage_confirme_paiement",
    { p_panne: panneId, p_confirme: boite.checked });
  boite.disabled = false;
  if(error){
    boite.checked = avant;               /* l'écran ne doit jamais mentir */
    return toast("Impossible d'enregistrer : " + error.message);
  }
  const p = G.pannes.find(x=>x.id===panneId);
  if(p) p.paiement_confirme_garage = boite.checked;
  toast(boite.checked ? "Paiement pointé. La direction le verra."
                      : "Pointage retiré.");
};

/* Les médias sont privés : on demande une adresse signée, valable une heure. */
async function afficherMedias(panneId){
  const z = document.getElementById("md-"+panneId);
  if(!z) return;
  const md = G.medias.filter(m=>m.panne_id===panneId);
  let html = "";
  for(const m of md){
    const {data} = await sb.storage.from("sb2-medias").createSignedUrl(m.chemin, 3600);
    const u = data?.signedUrl;
    if(!u){ html += `<div class="mt">Pièce indisponible</div>`; continue; }
    if(m.genre === "photo")
      html += `<a href="${u}" target="_blank" rel="noopener" style="display:block;margin-bottom:8px">
        <img src="${u}" alt="Photo du chauffeur" style="width:100%;border-radius:8px;display:block"
        onerror="this.parentNode.className='mt';this.parentNode.textContent='Photo indisponible — appuyez pour la voir'"></a>`;
    else if(m.genre === "audio")
      html += `<audio controls preload="none" src="${u}" style="width:100%;margin-bottom:8px"></audio>`;
    else
      html += `<video controls preload="metadata" src="${u}" playsinline
        style="width:100%;border-radius:8px;margin-bottom:8px"></video>`;
  }
  z.innerHTML = html || `<div class="mt">Aucune pièce jointe</div>`;
  z.classList.remove("mt");
}

const BDD = "sablier_file";

function ouvrirBdd(){
  if(bdd) return Promise.resolve(bdd);
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("stockage indisponible"));
    const r = indexedDB.open(BDD, 1);
    r.onupgradeneeded = () => {
      if(!r.result.objectStoreNames.contains("attente"))
        r.result.createObjectStore("attente", { keyPath:"id" });
    };
    r.onsuccess = () => { bdd = r.result; res(bdd); };
    r.onerror = () => rej(r.error || new Error("stockage refusé"));
  });
}
function transaction(mode, action){
  return ouvrirBdd().then(db => new Promise((res,rej)=>{
    const t = db.transaction("attente", mode);
    const s = t.objectStore("attente");
    const q = action(s);
    t.oncomplete = () => res(q && "result" in q ? q.result : undefined);
    t.onerror = () => rej(t.error);
  }));
}
const fileLire      = ()   => transaction("readonly",  s => s.getAll());
const fileAjouter   = (x)  => transaction("readwrite", s => s.add(x));
const fileSupprimer = (id) => transaction("readwrite", s => s.delete(id));
const fileMaj       = (x)  => transaction("readwrite", s => s.put(x));

let envoiEnCours = null;   /* promesse du vidage en cours, s'il y en a un */

/* Exposés pour pouvoir diagnostiquer un téléphone qui coince. */
window.fileLire = () => fileLire();
window.viderFile = () => viderFile();

/* Vide la file. Un élément qui échoue reste en place, il repartira plus tard.
   Si un vidage tourne déjà, on attend le sien plutôt que d'abandonner. */
function viderFile(silencieux){
  if(envoiEnCours) return envoiEnCours;
  if(!navigator.onLine) return Promise.resolve(0);
  envoiEnCours = vidageReel(silencieux).finally(()=>{ envoiEnCours = null; });
  return envoiEnCours;
}
async function vidageReel(silencieux){
  let liste = [];
  try{ liste = await fileLire(); }catch(e){ return 0; }
  if(!liste.length) return 0;

  let partis = 0;
  for(const el of liste){
    try{
      const {data,error} = await sb.from("sb2_pannes").insert({
        camion_id:el.camion_id, chauffeur_id:el.chauffeur_id,
        statut:"signalee", nature:"imprevue", description:el.description,
        immobilise:el.immobilise, immob_debut:el.immob_debut
      }).select().single();
      if(error) throw error;

      for(const f of (el.medias||[])){
        try{
          const ext = {photo:"jpg",audio:"webm",video:"mp4"}[f.genre];
          const chemin = `${data.id}/${crypto.randomUUID()}.${ext}`;
          const up = await sb.storage.from("sb2-medias").upload(chemin, f.blob, {contentType:f.blob.type});
          if(up.error) throw up.error;
          await sb.from("sb2_medias").insert({panne_id:data.id, genre:f.genre,
            chemin, taille:f.blob.size, duree_s:f.duree||null});
        }catch(e){ /* la panne est passée : une pièce perdue ne la bloque pas */ }
      }
      await fileSupprimer(el.id);
      prevenir(data.id, "panne_signalee");
      partis++;
    }catch(e){
      el.tentatives = (el.tentatives||0)+1;
      el.derniereErreur = String(e.message||e);
      try{ await fileMaj(el); }catch(_){}
    }
  }
  if(partis && !silencieux)
    toast(partis>1 ? `${partis} signalements envoyés.` : "Signalement envoyé.");
  return partis;
}

/* Demander au serveur de prévenir les autres personnes concernées.
   « Tire et oublie » VOLONTAIREMENT : quand cette fonction est appelée,
   le message ou la panne est DÉJÀ enregistré en base. Si la notification
   échoue (réseau coupé, serveur lent), il ne faut surtout pas afficher
   une erreur : l'utilisateur croirait que son envoi n'est pas parti,
   alors qu'il l'est. On note dans la console, et c'est tout.
   Le serveur ne notifie jamais l'expéditeur lui-même. */
async function prevenir(panneId, evenement){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return;
    await fetch(SB_URL + "/functions/v1/notifier", {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey": SB_CLE,
                 "Authorization": "Bearer " + session.access_token },
      body: JSON.stringify({ panne_id: panneId, evenement })
    });
  }catch(e){ console.warn("Notification non envoyée :", e); }
}

function b64ToU8(b64){
  const p = "=".repeat((4 - b64.length % 4) % 4);
  const s = (b64 + p).replace(/-/g,"+").replace(/_/g,"/");
  const brut = atob(s);
  return Uint8Array.from([...brut].map(c=>c.charCodeAt(0)));
}
const surEcranAccueil = () =>
  window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const iOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent);
const pushPossible = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

function etatNotifications(){
  if(!pushPossible())
    return iOS() && !surEcranAccueil()
      ? ["impossible","Ajoutez l'app à votre écran d'accueil pour recevoir les notifications"]
      : ["impossible","Ce navigateur ne gère pas les notifications"];
  if(Notification.permission === "denied")
    return ["refuse","Refusées. Réautorisez-les dans les réglages du navigateur"];
  if(Notification.permission === "granted") return ["actif","Actives sur cet appareil"];
  return ["inactif","Pas encore activées sur cet appareil"];
}

async function activerNotifications(){
  if(!pushPossible()){
    toast(iOS() && !surEcranAccueil()
      ? "Ajoutez d'abord l'app à votre écran d'accueil."
      : "Ce navigateur ne gère pas les notifications.");
    return false;
  }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== "granted"){ toast("Notifications refusées."); return false; }

    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;

    let abo = await reg.pushManager.getSubscription();
    if(!abo) abo = await reg.pushManager.subscribe({
      userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID) });

    const j = abo.toJSON();
    const {data:{user}} = await sb.auth.getUser();
    const {error} = await sb.from("sb2_abonnements").upsert({
      utilisateur_id:user.id, endpoint:j.endpoint,
      p256dh:j.keys.p256dh, auth:j.keys.auth,
      appareil:(navigator.userAgent.match(/\((.*?)\)/)||[,"appareil"])[1].slice(0,60),
      actif:true, echecs:0
    }, { onConflict:"endpoint" });
    if(error) throw error;

    toast("Notifications activées.");
    if(vue) rendu();
    return true;
  }catch(e){ toast("Activation impossible : " + (e.message||e)); return false; }
}
window.activerNotifications = activerNotifications;

/* Le son : joué dans l'app, sans fichier à télécharger. */
let sonCtx = null;
function preparerSon(){
  try{ sonCtx = sonCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function sonner(){
  if(!sonCtx) return;
  try{
    if(sonCtx.state === "suspended") sonCtx.resume();
    const t0 = sonCtx.currentTime;
    [880, 1320].forEach((f,i)=>{
      const o = sonCtx.createOscillator(), g = sonCtx.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t0 + i*0.18);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + i*0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i*0.18 + 0.16);
      o.connect(g).connect(sonCtx.destination);
      o.start(t0 + i*0.18); o.stop(t0 + i*0.18 + 0.18);
    });
  }catch(e){}
}
document.addEventListener("click", preparerSon, { once:true });

/* Détection des nouveautés pendant que l'app est ouverte. */
let connues = null;
function guetter(){
  if(!D || !moi || !["admin","dg"].includes(moi.role)) return;
  const ids = new Set(D.pannes.filter(p=>p.statut==="signalee").map(p=>p.id));
  if(connues === null){ connues = ids; return; }
  const nouvelles = [...ids].filter(x=>!connues.has(x));
  connues = ids;
  if(nouvelles.length){
    sonner();
    const p = D.pannes.find(x=>x.id===nouvelles[0]);
    toast(nouvelles.length>1
      ? `${nouvelles.length} nouvelles pannes signalées.`
      : `Panne signalée : ${nomCamion(p.camion_id)}`);
  }
}

window.dernierVendredi = () => dernierVendredi();
function dernierVendredi(){
  const d = new Date();
  const ecart = (d.getDay() + 2) % 7;   // vendredi = jour 5
  return ajoutJours(auj(), -ecart);
}

function libelleStatut(s){
  return { signalee:"En attente d'un garage", affectee:"Au garage", terminee:"Terminé, à régler" }[s] || s;
}

function donneesRecap(depuis){
  const programmees = D.pannes.filter(p =>
    p.nature === "programmee" && p.date_signalement.slice(0,10) >= depuis);
  const enAttente = D.pannes.filter(p => ["signalee","affectee","terminee"].includes(p.statut));
  return { programmees, enAttente };
}

window.formRecapWeekend = () => {
  const depuisDefaut = dernierVendredi();
  ouvrir("Récap du weekend", `
    <label class="ch"><span>Weekend du</span><input type="date" id="rc-depuis" value="${depuisDefaut}"></label>
    <div id="rc-apercu"></div>
    <div id="rc-msg"></div>
    <div class="duo"><button class="btn sec" onclick="fermer()">Annuler</button>
    <button class="btn" id="rc-partager" onclick="partagerRecap()">Préparer et partager</button></div>`,
    () => {
      const maj = () => rendreApercuRecap(val("rc-depuis") || depuisDefaut);
      document.getElementById("rc-depuis").addEventListener("input", maj);
      maj();
    });
};

function rendreApercuRecap(depuis){
  const { programmees, enAttente } = donneesRecap(depuis);
  let h = `<div class="titre-sec" style="margin-top:15px">Programmées ce weekend (${programmees.length})</div>`;
  h += programmees.length
    ? `<div class="carte" style="padding:9px 12px">` + programmees.map(p =>
        `<div class="ligne"><div class="lib"><b>${esc(nomCamion(p.camion_id))}</b>
          <small>${esc(p.piece || p.description || p.type || "—")} · ${esc(nomGarage(p.garage_id))}</small></div>
          <span class="num">${p.statut==="payee" ? fmt(coutPanne(p)) : "en cours"}</span></div>`).join("") + `</div>`
    : `<p class="mt">Aucune panne programmée saisie depuis cette date.</p>`;

  h += `<div class="titre-sec">En attente, pas encore réglées (${enAttente.length})</div>`;
  h += enAttente.length
    ? `<div class="carte" style="padding:9px 12px">` + enAttente.map(p =>
        `<div class="ligne"><div class="lib"><b>${esc(nomCamion(p.camion_id))}</b>
          <small>${esc(p.description || p.piece || "—")} · ${esc(libelleStatut(p.statut))}</small></div></div>`).join("") + `</div>`
    : `<p class="mt">Rien en attente : tout est réglé.</p>`;

  document.getElementById("rc-apercu").innerHTML = h;
}

window.partagerRecap = async () => {
  const depuis = val("rc-depuis") || dernierVendredi();
  const { programmees, enAttente } = donneesRecap(depuis);
  if(!programmees.length && !enAttente.length) return msgRecap("Rien à envoyer pour l'instant.", "ocre");

  const b = document.getElementById("rc-partager");
  b.disabled = true; b.textContent = "Préparation…";

  // Étape 1 : construire le PDF. Un échec ici est un vrai problème à signaler.
  let blob, nomFichier;
  try{
    const { jsPDF } = await import("https://cdn.jsdelivr.net/npm/jspdf@2.5.2/+esm");
    await import("https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/+esm");
    const doc = construireRecapPDF(new jsPDF(), depuis, programmees, enAttente);
    nomFichier = `recap-weekend-${depuis}.pdf`;
    blob = doc.output("blob");
  }catch(e){
    msgRecap("Impossible de préparer le PDF : vérifie ta connexion et réessaie.", "rouge");
    b.disabled = false; b.textContent = "Préparer et partager";
    return;
  }

  // Étape 2 : proposer le partage natif. Le PDF existe déjà à ce stade —
  // si le partage ne s'ouvre pas (geste utilisateur expiré, refus, etc.),
  // on bascule sur le téléchargement plutôt que d'inquiéter avec une erreur.
  const fichier = new File([blob], nomFichier, { type:"application/pdf" });
  let partage = false;
  if(navigator.canShare && navigator.canShare({ files:[fichier] })){
    try{
      await navigator.share({ files:[fichier], title:"Récap du weekend",
        text:"Récap du weekend — " + dateLongue(depuis) });
      partage = true;
    }catch(e){ if(e.name === "AbortError") partage = true; }
  }
  if(partage){ fermer(); toast("Récap prêt."); return; }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomFichier; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  msgRecap("PDF enregistré. Ouvre-le depuis Fichiers et partage-le vers WhatsApp.", "verte");
  b.disabled = false; b.textContent = "Préparer et partager";
};
function msgRecap(t,y){
  const z = document.getElementById("rc-msg");
  if(z) z.innerHTML = `<div class="alerte a-${y}"><div>${esc(t)}</div></div>`;
}

function construireRecapPDF(doc, depuis, programmees, enAttente){
  const largeur = doc.internal.pageSize.getWidth();
  const INDIGO = [39,54,139];

  doc.setFillColor(...INDIGO);
  doc.rect(0, 0, largeur, 30, "F");
  try{ doc.addImage(LOGO_PDF, "PNG", 12, 6, 12.5, 18); }catch(e){}
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(15);
  doc.text("Récapitulatif du weekend", 30, 14);
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  doc.text(`Weekend du ${dateLongue(depuis)}`, 30, 21);
  doc.setFontSize(7.5);
  doc.text("ETS DJOLO SALIFOU NAWAL — BTP, Commerce général", largeur-12, 12, { align:"right" });
  doc.text("RCCM RB/COT/17 A 34908 · IFU 0201710173898", largeur-12, 17, { align:"right" });
  doc.text(`Édité le ${dateLongue(auj())}`, largeur-12, 22, { align:"right" });

  let y = 40;
  doc.setTextColor(20,20,20);
  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text(`Pannes programmées ce weekend (${programmees.length})`, 12, y);
  y += 4;

  if(programmees.length){
    doc.autoTable({
      startY: y,
      head: [["Camion","Pièce","Garage","Statut","Montant (F)"]],
      body: programmees.map(p => [
        nomCamion(p.camion_id), p.piece || p.description || p.type || "—",
        nomGarage(p.garage_id), p.statut==="payee" ? "Réglé" : "En cours",
        p.statut==="payee" ? fmt(coutPanne(p)) : "—"
      ]),
      theme: "grid", styles:{ fontSize:9, cellPadding:2.2 },
      headStyles:{ fillColor:INDIGO, textColor:255, fontStyle:"bold" },
      margin:{ left:12, right:12 }
    });
    y = doc.lastAutoTable.finalY + 10;
  } else {
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(90,90,90);
    doc.text("Aucune panne programmée saisie depuis cette date.", 12, y+4);
    y += 14;
  }

  doc.setTextColor(20,20,20);
  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text(`En attente, pas encore réglées (${enAttente.length})`, 12, y);
  y += 4;

  if(enAttente.length){
    doc.autoTable({
      startY: y,
      head: [["Camion","Description","Statut","Signalée le"]],
      body: enAttente.map(p => [
        nomCamion(p.camion_id), p.description || p.piece || "—",
        libelleStatut(p.statut), dateCourte(p.date_signalement)
      ]),
      theme:"grid", styles:{ fontSize:9, cellPadding:2.2 },
      headStyles:{ fillColor:[180,68,42], textColor:255, fontStyle:"bold" },
      margin:{ left:12, right:12 }
    });
    y = doc.lastAutoTable.finalY + 10;
  } else {
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(90,90,90);
    doc.text("Rien en attente : tout est réglé.", 12, y+4);
    y += 14;
  }

  const hauteur = doc.internal.pageSize.getHeight();
  doc.setDrawColor(210,210,210); doc.line(12, hauteur-16, largeur-12, hauteur-16);
  doc.setFont("helvetica","italic"); doc.setFontSize(7.5); doc.setTextColor(120,120,120);
  doc.text(`Établi par ${moi.nom} — GestFlot`, 12, hauteur-11);
  return doc;
}

window.formCloturer = (per, d1, d2) => {
  const t = totaux(d1, d2);
  const nom = { semaine:"cette semaine", mois:"ce mois", annee:"cette année" }[per];
  ouvrir("Clôturer " + nom,
    `<p class="mt" style="margin-bottom:12px">Du ${dateLongue(d1)} au ${dateLongue(d2)}.</p>
     <div class="carte" style="padding:9px 12px;margin-bottom:12px">
       <div class="ligne"><div class="lib"><b>Solde reporté</b></div><span class="num">${fmtF(t.reporte)}</span></div>
       <div class="ligne"><div class="lib"><b>Entrées</b></div><span class="num">${fmtF(t.entrees)}</span></div>
       <div class="ligne"><div class="lib"><b>Sorties</b></div><span class="num">${fmtF(t.sorties)}</span></div>
       <div class="ligne" style="border-bottom:0"><div class="lib"><b>Solde de fin</b>
         <small>Report sur la période suivante</small></div>
         <span class="num" style="font-weight:700;font-size:17px">${fmtF(t.soldeFin)}</span></div>
     </div>
     <div class="alerte a-ocre"><div><b>Ces chiffres deviendront définitifs</b>
       Plus aucune saisie ni correction ne sera possible sur cette période.
       Vérifie que tout est enregistré avant de continuer.</div></div>
     <div id="cl-msg"></div>
     <div class="duo"><button class="btn sec" onclick="fermer()">Annuler</button>
     <button class="btn" id="cl-ok" onclick="validerCloture('${per}','${d1}','${d2}')">Clôturer</button></div>`);
};
window.validerCloture = async (per, d1, d2) => {
  const b = document.getElementById("cl-ok");
  b.disabled = true; b.textContent = "Clôture…";
  const { error } = await sb.rpc("sb2_cloturer", { p_periode:per, p_d1:d1, p_d2:d2 });
  if(error){
    const msg = String(error.message||"");
    document.getElementById("cl-msg").innerHTML =
      `<div class="alerte a-rouge"><div>${
        msg.includes("PERIODE_NON_TERMINEE") ? "Cette période n'est pas encore terminée."
        : msg.includes("DEJA_CLOTUREE") ? "Cette période est déjà clôturée."
        : "Clôture impossible : " + esc(msg)}</div></div>`;
    b.disabled = false; b.textContent = "Clôturer";
    return;
  }
  fermer(); toast("Période clôturée."); await recharger();
};
window.formRouvrir = (id) => {
  ouvrir("Rouvrir la période",
    `<div class="alerte a-ocre"><div><b>Les chiffres figés seront perdus</b>
       Le rapport redeviendra modifiable et ne correspondra plus forcément à celui que tu as remis.
       À ne faire que pour corriger une erreur.</div></div>
     <div class="duo"><button class="btn sec" onclick="fermer()">Annuler</button>
     <button class="btn danger" onclick="validerReouverture('${id}')">Rouvrir</button></div>`);
};
window.validerReouverture = async (id) => {
  const { error } = await sb.rpc("sb2_rouvrir", { p_id:id });
  if(error) return toast("Échec : " + error.message);
  fermer(); toast("Période rouverte."); await recharger();
};

/* ================= 15. DÉMARRAGE ================= */
async function demarrer(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return ecranAccueil();

  const {data,error} = await sb.rpc("sb2_moi");
  if(error){ ecranAccueil(`<div class="alerte a-rouge"><div>${esc(error.message)}</div></div>`); return; }
  moi = Array.isArray(data) ? data[0] : data;

  if(!moi || moi.role==="inconnu") return ecranRattachement();
  if(moi.role==="chauffeur"){
    try{ await chargerChauffeur(); rendreChauffeur(); }
    catch(e){ document.getElementById("racine").innerHTML =
      `<div id="accueil"><div class="marque-g">GestFlot</div>
       <div class="alerte a-rouge"><div><b>Chargement impossible</b>${esc(e.message)}</div></div>
       <button class="btn" style="width:100%" onclick="location.reload()">Réessayer</button></div>`; }
    return;
  }
  if(moi.role==="garage"){
    try{ await chargerGarage(); rendreGarage(); }
    catch(e){ document.getElementById("racine").innerHTML =
      `<div id="accueil"><div class="marque-g">GestFlot</div>
       <div class="alerte a-rouge"><div><b>Chargement impossible</b>${esc(e.message)}</div></div>
       <button class="btn" style="width:100%" onclick="location.reload()">Réessayer</button></div>`; }
    return;
  }

  charpente();
  /* 5 minutes : suffisant pour 15 camions, et divise par 5 le trafic
     sortant Supabase par rapport à un rafraîchissement à la minute. */
  setInterval(()=>{ if(!document.hidden && navigator.onLine) recharger(true).catch(()=>{}); }, 300000);
  try{ await charger(); guetter(); }
  catch(e){
    if(chargerCache()) toast("Hors ligne — dernières données connues.");
    else { document.getElementById("main").innerHTML =
      `<div class="alerte a-rouge"><div><b>Chargement impossible</b>${esc(e.message)}</div></div>`; return; }
  }
  rendu();
}

window.addEventListener("online", ()=>{
  enLigne=true;
  viderFile().then(()=>recharger(true)).catch(()=>{});
});
window.addEventListener("offline", ()=>{ enLigne=false; if(D) bandeaux(); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && moi && D) recharger(true).catch(()=>{}); });

/* Accès par lien personnel : ?a=JETON
   Une fonction serveur vérifie le jeton et ouvre une vraie session.
   Le même lien mène toujours au même compte, sur n'importe quel appareil. */
async function ouvrirParLien(jeton){
  const r = await fetch(SB_URL + "/functions/v1/acces-flotte", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":SB_CLE, "Authorization":"Bearer "+SB_CLE },
    body: JSON.stringify({ jeton })
  });
  if(!r.ok) throw new Error(r.status === 401 ? "JETON_INVALIDE" : "SERVEUR");
  const d = await r.json();
  const { error } = await sb.auth.setSession({
    access_token:d.access_token, refresh_token:d.refresh_token });
  if(error) throw new Error("SESSION");
  return d;
}
function echecLien(cause){
  const quoi = cause === "JETON_INVALIDE"
    ? "Ce lien n'est plus valable. Demande-en un nouveau à SARANA."
    : "Impossible de joindre le serveur. Vérifie ta connexion et rouvre le lien.";
  document.getElementById("racine").innerHTML =
    `<div id="accueil"><div class="marque-g">GestFlot</div>
     <div class="alerte a-rouge"><div><b>Accès impossible</b>${esc(quoi)}</div></div>
     <button class="btn" style="width:100%" onclick="location.reload()">Réessayer</button></div>`;
}

(async function(){
  const jeton = new URLSearchParams(location.search).get("a");
  if(jeton){
    document.getElementById("racine").innerHTML =
      `<div id="accueil"><div class="marque-g">GestFlot</div>
       <div class="sous">Ouverture de votre accès…</div></div>`;
    try{ await ouvrirParLien(jeton); }
    catch(e){ return echecLien(e.message); }
    /* purement cosmétique : ne doit jamais empêcher l'accès */
    try{ history.replaceState({},"",location.pathname); }catch(e){}
  }
  demarrer();
})();
</script>
