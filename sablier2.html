<title>GestFlot — Flotte DSN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --vert:#27368B; --vert-clair:#3A4CA8; --nuit:#1B2660;
  --minium:#D9694F; --sable:#D2A24C;
  --ciment:#EDEFF2; --ciment-fonce:#D8DCE8; --encre:#33394A; --encre-doux:#868DA3;
  --craie:#fff; --filet:#DCE0E9; --filet-fonce:#C7CCDA;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  --r:10px; --nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ciment);color:var(--encre);
  font-family:"Archivo","Public Sans",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
.num{font-family:"Archivo",system-ui,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-weight:700}
.im{font-family:var(--mono);letter-spacing:-.01em}
h1,h2,h3{font-family:"Archivo",system-ui,Arial,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.12}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

#app{display:flex;flex-direction:column;min-height:100%}

/* ── Barre du haut : claire, un filet, l'accent chantier en pied ── */
#topbar{
  position:relative;position:sticky;top:0;z-index:40;background:var(--craie);color:var(--nuit);
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;font-size:11.5px;
  border-bottom:1px solid var(--filet);
}
#topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;z-index:1;
  background:repeating-linear-gradient(-45deg,var(--vert) 0 8px,var(--sable) 8px 16px);
}
#topbar .marque{font-family:"Archivo";font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--nuit)}
#topbar .solde-haut{display:none;align-items:baseline;gap:8px}
#topbar .solde-haut b{font-family:"Archivo";font-size:17px;font-variant-numeric:tabular-nums;color:var(--vert)}
#topbar .solde-haut span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-doux)}
#topbar .cycle{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--mono);
  font-size:10px;letter-spacing:.03em;color:var(--encre-doux)}
#topbar .etat{display:flex;align-items:center;gap:6px;padding-left:11px;margin-left:11px;
  border-left:1px solid var(--filet);flex:none}
#topbar .etat .lbl{font-style:normal}
.pastille{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
#main{flex:1;padding:14px 14px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));
  max-width:1120px;width:100%;margin:0 auto;container-type:inline-size}

/* La mise en page suit la place disponible, pas la taille de l'appareil. */
.grille{display:grid;gap:12px;grid-template-columns:1fr;align-items:start}
.grille>div{min-width:0}
.grille .large{grid-column:1 / -1}
@container (min-width: 640px){
  .grille{grid-template-columns:minmax(280px,1fr) minmax(300px,1.1fr)}
}
@container (min-width: 1060px){
  .grille{grid-template-columns:minmax(280px,.9fr) minmax(320px,1.1fr) minmax(280px,1fr)}
}
.carte>p.mt{max-width:70ch}

/* ── Navigation : icônes déjà monochromes, étiquettes en mono ── */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--craie);
  border-top:1px solid var(--filet);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--encre-doux);font-weight:500;white-space:nowrap;
  border-top:2px solid transparent;margin-top:-1px}
#nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--vert);border-top-color:var(--vert);font-weight:700}
#nav .logo-nav{display:none}

/* ── Cartes, lignes : plates, un filet, jamais d'ombre ── */
.carte{background:var(--craie);border:1px solid var(--filet);border-radius:var(--r);padding:15px;margin-bottom:13px}
.titre-sec{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--encre-doux);margin:22px 0 9px;padding-bottom:7px;
  border-bottom:1.5px solid var(--vert)}
.titre-sec:first-child{margin-top:0}
.ligne{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--ciment-fonce)}
.ligne>div:last-child{flex:none;text-align:right}
.ligne>span.num{flex:none;white-space:nowrap}
.ligne:last-child{border-bottom:0}
.lib{min-width:0}
.lib b{display:block;font-weight:600;color:var(--nuit)}
.lib small{color:var(--encre-doux);font-size:12.5px}
.mt{color:var(--encre-doux);font-size:12.5px}
.vide{text-align:center;color:var(--encre-doux);padding:26px 12px;font-size:14px}
.vide b{display:block;color:var(--encre);font-weight:600;margin-bottom:4px}

/* Sous-groupe à l'intérieur d'une carte — sépare sans multiplier les cadres */
.grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--encre-doux);padding:16px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.grp:first-child{padding-top:0}
.grp b{font-weight:700;color:var(--nuit)}

/* ── Bouton, entrées : angles nets, un filet, pas de relief ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:8px;
  font-weight:700;font-size:14.5px;background:var(--vert);color:#fff;width:100%;text-align:center;
  border:1px solid var(--vert)}
.btn:active{background:var(--nuit);border-color:var(--nuit)}
.btn.sec{background:var(--craie);color:var(--nuit);border:1px solid var(--filet-fonce)}
.btn.sec:active{background:var(--ciment)}
.btn.danger{background:var(--craie);color:var(--minium);border:1px solid var(--minium)}
.btn.danger:active{background:#FBF0ED}
.btn.mini{width:auto;padding:8px 13px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}
.duo{display:flex;gap:9px}
.duo .btn{flex:1}

label.ch{display:block;margin-bottom:11px}
label.ch>span{display:block;font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;color:var(--encre-doux);margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--filet-fonce);border-radius:8px;
  background:var(--craie);font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--vert);outline-offset:1px;border-color:var(--vert)}
input[type=number]{font-family:"Archivo";font-variant-numeric:tabular-nums}
.rang{display:flex;gap:9px}
.rang>*{flex:1;min-width:0}
.segm{display:flex;border-radius:8px;overflow:hidden;background:var(--craie);border:1px solid var(--filet-fonce)}
.segm button{flex:1;padding:11px 6px;font-size:13.5px;font-weight:600;color:var(--encre-doux);background:transparent}
.segm button+button{border-left:1px solid var(--filet-fonce)}
.segm button.on{background:var(--vert);color:#fff}
.segm.ocre button.on{background:var(--sable);color:#2C2205}

/* ── Preuves jointes (photo/audio/vidéo) : icône + légende ── */
.btn-ic{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;
  padding:13px 4px 11px;border:1px solid var(--filet-fonce);border-radius:8px;
  background:var(--craie);color:var(--nuit)}
.btn-ic:active{background:var(--ciment)}
.btn-ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.btn-ic span{font-family:var(--mono);font-size:9px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--encre-doux)}

/* ── Barre d'enregistrement audio, à la manière de WhatsApp ── */
.rec-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:1px solid var(--minium);border-radius:8px;background:#FBF0ED}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--minium);flex:none;
  animation:rec-pulse 1.1s ease-in-out infinite}
@keyframes rec-pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rec-time{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--minium);
  flex:none;min-width:32px}
.rec-wave{flex:1;display:flex;align-items:center;justify-content:space-between;
  gap:2px;height:24px;overflow:hidden}
.rec-wave i{display:block;flex:1;min-width:2px;height:3px;border-radius:2px;
  background:var(--minium);transition:height .07s linear}
.rec-stop{flex:none;width:32px;height:32px;border-radius:50%;background:var(--minium);
  border:none;display:flex;align-items:center;justify-content:center}
.rec-stop svg{width:12px;height:12px;fill:#fff}

/* ── Discussion attachée à une panne ── */
.fil-msg{max-height:52vh;overflow-y:auto}
.fil-msg::after{content:"";display:block;clear:both}
.bulle-msg{max-width:80%;margin-bottom:11px;clear:both}
.bulle-msg.moi{float:right;text-align:right}
.bulle-msg:not(.moi){float:left;text-align:left}
.bulle-aut{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--encre-doux);margin-bottom:3px}
.bulle-corps{display:inline-block;text-align:left;background:var(--ciment);color:var(--encre);
  border-radius:12px 12px 12px 3px;padding:8px 11px;font-size:13.5px;line-height:1.4;
  max-width:100%;word-wrap:break-word;white-space:pre-wrap}
.bulle-msg.moi .bulle-corps{background:var(--vert);color:#fff;border-radius:12px 12px 3px 12px}
.bulle-heure{font-family:var(--mono);font-size:9px;color:var(--encre-doux);margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--encre-doux);
  padding:0 8px 7px 0;font-weight:500;border-bottom:1.5px solid var(--vert)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--ciment);vertical-align:top}
th.n,td.n{text-align:right;padding-right:0}
td.n{font-family:"Archivo";font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}

/* ── Étiquettes : contour fin, pas de pastille pleine ── */
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-family:var(--mono);
  font-size:9.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  vertical-align:middle;border:1px solid}
.t-rouge{background:#FBF0ED;color:var(--minium);border-color:var(--minium)}
.t-ocre{background:#FAF0DC;color:#8A6720;border-color:var(--sable)}
.t-vert{background:var(--craie);color:var(--vert);border-color:var(--filet-fonce)}
.t-gris{background:var(--ciment);color:var(--encre-doux);border-color:var(--filet)}

#modale{position:fixed;inset:0;z-index:80;background:rgba(20,23,26,.5);display:none;align-items:flex-end;justify-content:center}
#modale.on{display:flex}
#modale-in{background:var(--craie);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--filet);box-shadow:0 -6px 20px rgba(27,38,96,.1)}
#modale-in h2{font-size:18px;margin-bottom:14px;color:var(--nuit)}
.poignee{width:38px;height:4px;background:var(--filet-fonce);border-radius:2px;margin:0 auto 13px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px);z-index:90;
  background:var(--nuit);color:#fff;padding:11px 17px;border-radius:8px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center}
#toast.on{opacity:1}

/* ── Onglets : soulignement, pas de pilule ── */
.onglets{display:flex;gap:20px;margin-bottom:13px;overflow-x:auto;border-bottom:1px solid var(--filet)}
.onglets button{padding:8px 0;font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;color:var(--encre-doux);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.onglets button.on{color:var(--vert);border-bottom-color:var(--vert);font-weight:700}

.medias{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.medias a{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:6px;
  background:var(--ciment);font-size:12px;font-weight:600;color:var(--encre);text-decoration:none}
.lien-copie{font-family:var(--mono);font-size:11px;word-break:break-all;background:var(--ciment);
  padding:9px 10px;border-radius:6px;margin:7px 0;color:var(--encre-doux)}

.alerte{border-radius:8px;padding:11px 13px;margin-bottom:12px;font-size:13.5px}
.alerte b{display:block;margin-bottom:2px;color:var(--nuit)}
.a-rouge{background:#FBF0ED;color:#8A4531;border-left:3px solid var(--minium)}
.a-ocre{background:#FAF0DC;color:#6B4B12;border-left:3px solid var(--sable)}
.a-verte{background:#E9EDFB;color:#1B2660;border-left:3px solid var(--vert)}

/* ── Accueil ── */
#accueil{max-width:420px;margin:0 auto;padding:0 18px 34px}
#accueil .hazard{height:4px;margin:0 -18px 32px;
  background:repeating-linear-gradient(-45deg,var(--vert) 0 8px,var(--sable) 8px 16px)}
#accueil .marque-g{font-family:"Archivo";font-weight:800;font-size:27px;letter-spacing:-.02em;
  color:var(--nuit);text-align:center;margin-bottom:6px}
#accueil .sous{text-align:center;color:var(--encre-doux);font-size:13.5px;margin-bottom:22px}

@media(min-width:900px){
  #app{flex-direction:row;background:linear-gradient(to right,var(--craie) 0 212px,var(--ciment) 212px)}
  #nav{position:sticky;top:0;bottom:auto;height:100vh;width:212px;flex:none;flex-direction:column;
    border-top:0;border-right:1px solid var(--filet);padding:14px 10px;gap:2px}
  #nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;padding:10px 12px;
    font-size:12.5px;border-top:0;border-left:3px solid transparent;border-radius:6px;margin-top:0}
  #nav button.on{border-left-color:var(--vert);background:var(--ciment)}
  #nav .logo-nav{display:flex;align-items:center;gap:10px;padding:8px 12px 20px;
    font-family:"Archivo";font-weight:800;font-size:18px;letter-spacing:-.015em;color:var(--vert)}
  #zone{flex:1;min-width:0;display:flex;flex-direction:column}
  #topbar{padding:12px 26px}
  #topbar .marque{display:none}
  #topbar .solde-haut{display:flex}
  #main{padding:22px 30px 60px;max-width:none}
  .scroll-x{margin:0;padding:0}
  .btn{width:auto;min-width:170px}
  .grille2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .grille2>*{margin-bottom:0}
}
@media print{
  /* Marge haute plus large : le titre courant s'y loge. */
  @page{ size:A4; margin:16mm 14mm 18mm; }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;color:#1a1a1a;font-size:9.5pt;line-height:1.4}
  #nav,#topbar,.no-print,#toast,#modale{display:none !important}
  #main{padding:0;max-width:none}

  /* ── Titres de section : filet plein, pas de pave de couleur ── */
  .titre-sec{ font-size:10.5pt; font-weight:700; color:#27368B;
    text-transform:uppercase; letter-spacing:.06em;
    border-bottom:1.5pt solid #27368B; padding-bottom:2pt;
    margin:14pt 0 6pt; break-after:avoid; page-break-after:avoid; }

  /* ── Cartes : simple encadre discret, jamais coupe ── */
  .carte{ border:.5pt solid #c8ccd8; break-inside:avoid; page-break-inside:avoid;
    padding:7pt 8pt; margin-bottom:7pt; background:#fff !important;
    box-shadow:none !important; border-radius:3pt; }

  /* ── Tableaux : lisibilite avant tout ── */
  .scroll-x{overflow:visible;margin:0;padding:0}
  table{ width:100%; border-collapse:collapse; font-size:8.8pt; }
  thead{ display:table-header-group; }   /* l'en-tete se repete a chaque page */
  tr{ break-inside:avoid; page-break-inside:avoid; }
  th{ background:#27368B !important; color:#fff !important;
    padding:4pt 5pt; border:0; text-align:left; font-size:8pt;
    text-transform:uppercase; letter-spacing:.04em; font-weight:700; }
  th.n, td.n{ text-align:right; font-variant-numeric:tabular-nums; }
  td{ padding:3.5pt 5pt; border-bottom:.5pt solid #dfe2ea; vertical-align:top; }
  /* Alternance discrete : facilite le suivi des lignes longues */
  tbody tr:nth-child(even) td{ background:#f6f7fa; }
  tbody tr:last-child td{ border-bottom:.5pt solid #9aa0b4; }
  /* Ligne de total : reperable sans couleur criarde */
  tbody tr:last-child td b{ font-size:9.2pt; }
  table small{ font-size:7.5pt; color:#666; }

  /* ── Chiffres cles ── */
  .num,.gros{ font-variant-numeric:tabular-nums; }
  .tag{ border:.5pt solid #999 !important; background:#fff !important;
    color:#333 !important; font-size:7.5pt; padding:1pt 4pt; }

  /* ── Blocs reserves a l'impression ── */
  .imprime-entete{display:block !important}
  .imprime-cloture{display:block !important}
  .imprime-signature{display:flex !important}
  .imprime-pied{display:block !important}
}
.logo{display:block;color:currentColor}
.logo-cote{height:40px;width:auto;color:var(--vert);flex:none}
.logo-mono{height:22px;width:auto;color:var(--vert);flex:none}
.logo-fond{position:absolute;right:-15%;top:-28%;height:176%;color:#fff;opacity:.11;pointer-events:none}
.logo-accueil{height:88px;width:auto;margin:0 auto 18px;color:var(--vert);display:block}

/* ── Tableau de bord : Action + Flotte, à plat, identité DSN ── */
.bord-section{padding:0}
.bord-section+.bord-section{margin-top:22px}
.bord-section-head{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:8px;margin-bottom:2px;border-bottom:1.5px solid var(--vert)}
.bord-section-head .lbl{font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--encre-doux)}
.bord-section-head .ct{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--vert)}

.bord-tache{padding:12px 0 11px;border-bottom:1px solid var(--ciment-fonce);
  display:flex;gap:12px;cursor:pointer}
.bord-tache:last-child{border-bottom:0}
.bord-tache-num{font-family:var(--mono);font-size:10px;font-weight:700;
  color:var(--encre-doux);min-width:16px;padding-top:2px;flex:none}
.bord-tache-txt{min-width:0}
.bord-tache-txt b{display:block;font-family:"Archivo";font-size:14px;font-weight:600;
  line-height:1.32;letter-spacing:-.1px;color:var(--nuit)}
.bord-tache-txt small{display:block;font-family:var(--mono);font-size:10px;
  color:var(--encre-doux);margin-top:4px;line-height:1.5}
/* Une seule tâche porte la couleur : la plus urgente du jour, si vraiment bloquante */
.bord-tache.premier{background:var(--ciment);margin:0 -15px 0;padding:12px 15px 11px;
  border-left:3px solid var(--minium);border-bottom:1px solid var(--ciment-fonce)}
.bord-tache.premier .bord-tache-num{color:var(--minium)}
.bord-tache.premier .bord-tache-txt b{font-size:15px;font-weight:700}
.bord-tache.j .bord-tache-num{color:#8A6720}
.bord-tache.v .bord-tache-num{color:var(--vert)}
.bord-tache-plus{font-family:var(--mono);font-size:10.5px;color:var(--encre-doux);
  padding:10px 2px 0;font-style:italic}

.bord-caisse{display:flex;align-items:center;border-top:1px solid var(--ciment-fonce);
  border-bottom:1px solid var(--ciment-fonce);margin:4px 0}
.bord-caisse>div:first-child{flex:1;padding:14px 0}
.bord-caisse-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--encre-doux)}
.bord-caisse-val{font-family:"Archivo";font-size:23px;font-weight:800;color:var(--vert);
  font-variant-numeric:tabular-nums;line-height:1.25;margin-top:3px}
.bord-caisse-sub{font-family:var(--mono);font-size:10.5px;color:#3E7A54;margin-top:2px}
.bord-caisse-sub.alerte{color:var(--minium)}
.bord-caisse-anneau{width:52px;height:52px;flex:none;margin-left:12px}

.bord-flotte{display:grid;grid-template-columns:1fr;gap:0;padding-top:4px}
@container (min-width:520px){ .bord-flotte{grid-template-columns:1fr 1fr;column-gap:20px} }
.bord-camion{padding:10px 0;border-bottom:1px solid var(--ciment-fonce);display:flex;
  align-items:center;gap:10px;cursor:pointer}
.bord-camion:last-child{border-bottom:0}
.bord-camion-ic{width:7px;height:7px;border-radius:50%;flex:none;background:var(--filet-fonce)}
.bord-camion-ic.m{background:var(--minium)}
.bord-camion-ic.s{background:var(--sable)}
.bord-camion-info{min-width:0;flex:1}
.bord-camion-nom{font-family:var(--mono);font-size:12.5px;font-weight:700;
  letter-spacing:-.01em;color:var(--nuit)}
.bord-camion-etat{font-size:11.5px;color:var(--encre-doux);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bord-camion-etat.r{color:var(--minium)}
.bord-camion-etat.o{color:#8A6720}

.bord-mouv-item{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--ciment-fonce)}
.bord-mouv-item:last-child{border-bottom:none}
.bord-mouv-lib{font-size:13px;font-weight:600;color:var(--nuit)}
.bord-mouv-date{font-family:var(--mono);font-size:10px;color:var(--encre-doux);margin-top:1px}
.bord-mouv-val{font-family:"Archivo";font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.bord-mouv-val.plus{color:var(--vert)}
.bord-mouv-val.moins{color:var(--encre)}

.bord-btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.bord-btn{border-radius:8px;padding:14px 8px;font-family:var(--mono);font-size:11px;
  font-weight:500;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:1px solid}
.bord-btn.primary{background:var(--vert);color:#fff;border-color:var(--vert)}
.bord-btn.sec{background:var(--craie);color:var(--nuit);border-color:var(--filet-fonce)}
.bord-btn.full{grid-column:1/-1;background:var(--craie);color:var(--minium);border-color:var(--minium)}

/* Case « J'ai ete paye » du garage */
.pointe-paye{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.pointe-paye input{width:15px;height:15px;accent-color:var(--vert);cursor:pointer;flex:none}
.pointe-paye span{font-size:11px;color:var(--encre-doux)}
.pointe-paye input:checked+span{color:var(--vert);font-weight:600}

/* Signal du garage, vu cote direction */
.tag.t-pointe{background:#E6F0E9;color:#1F5B3C;border:1px solid #BFD9C9}

/* ── Bandeau collecte ──
   Ne s'affiche que si la semaine est incomplete ET qu'on est en fin de
   semaine ou que la collecte a commence. Sinon il serait permanent, donc
   invisible a force d'etre la. */
.bord-collecte{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--sable);border-radius:var(--r);padding:11px 14px;margin-bottom:20px;cursor:pointer}
.bord-collecte b{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#4A3A10}
.bord-collecte i{font-style:normal;font-size:15px;color:#4A3A10;flex:none}

/* ── Flotte en vignettes ── */
.bord-grille{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding-top:8px}
@container (min-width:520px){ .bord-grille{grid-template-columns:repeat(5,1fr)} }
.bord-vig{background:var(--ciment);border-radius:8px;padding:9px 5px 8px;text-align:center;
  cursor:pointer;border:1px solid transparent}
.bord-vig.alerte{border-color:var(--filet-fonce)}
.bord-vig-pt{width:7px;height:7px;border-radius:50%;margin:0 auto 5px;background:var(--filet-fonce)}
.bord-vig-pt.m{background:var(--minium)}
.bord-vig-pt.s{background:var(--sable)}
.bord-vig-nom{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--nuit);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bord-vig-et{font-size:9.5px;color:var(--encre-doux);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bord-vig-et.r{color:var(--minium)}
.bord-vig-et.o{color:#8A6720}

/* ── Recettes de la semaine ──
   Une barre par camion attendu. Grise = pas encore encaisse. */
.bord-barres{display:flex;align-items:flex-end;gap:4px;height:58px;padding-top:12px}
.bord-barre{flex:1;background:var(--vert);border-radius:3px 3px 0 0;min-height:3px}
.bord-barre.vide{background:var(--ciment-fonce)}
.bord-barres-pied{font-family:var(--mono);font-size:10px;color:var(--encre-doux);margin-top:9px}

/* ── Deux colonnes sur grand ecran ──
   L'ordre du HTML reste celui du telephone ; la grille nommee replace
   les blocs sur ordinateur sans toucher au balisage. */
@container (min-width:760px){
  .bord-wrap{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;row-gap:22px;
    align-items:start;
    grid-template-areas:"zc zc" "zcaisse ztaches" "zrec zflotte" "zmouv zbtns"}
  .bord-wrap .bord-section+.bord-section{margin-top:0}
  .bord-wrap .bord-btn-grid{margin-top:0}
  .bord-wrap .bord-collecte{margin-bottom:0}
  .z-collecte{grid-area:zc} .z-caisse{grid-area:zcaisse} .z-taches{grid-area:ztaches}
  .z-recettes{grid-area:zrec} .z-flotte{grid-area:zflotte}
  .z-mouv{grid-area:zmouv} .z-btns{grid-area:zbtns}
}

.logo-entete{height:74px;width:auto;color:#27368B;flex:none}
.imprime-cloture{display:none;font-size:8.5pt;color:#444;margin:-3pt 0 8pt;font-style:italic}

/* ── En-tete officiel ETS DSN, visible seulement a l'impression ── */
.imprime-entete{display:none;position:relative;overflow:hidden;
  border-bottom:2pt solid #27368B;padding:0 0 8pt;margin:0 0 12pt}
.imprime-entete .tete{display:flex;align-items:flex-start;justify-content:space-between;
  gap:16pt;position:relative}
.imprime-entete .marque{display:flex;align-items:center;gap:9pt}
.imprime-entete .logo-entete{height:46pt;width:auto;color:#27368B;flex:none}
.imprime-entete .raison{font-size:12pt;font-weight:800;color:#27368B;
  letter-spacing:-.01em;line-height:1.15}
.imprime-entete .activite{font-size:7.5pt;color:#555;letter-spacing:.05em;
  text-transform:uppercase;margin-top:1pt}
.imprime-entete .ident{font-size:7pt;color:#555;line-height:1.45;text-align:right;flex:none}
.imprime-entete .objet{margin-top:9pt;display:flex;align-items:baseline;
  justify-content:space-between;gap:12pt}
.imprime-entete h1{font-size:13pt;color:#1a1a1a;font-weight:800;letter-spacing:-.01em}
.imprime-entete .periode{font-size:8.5pt;color:#444;margin-top:1pt}
.imprime-entete .edite{font-size:7.5pt;color:#777;white-space:nowrap;flex:none}

/* ── Pied de page ── */
.imprime-pied{display:none;margin-top:14pt;padding-top:5pt;
  border-top:.5pt solid #c8ccd8;font-size:7pt;color:#777;
  justify-content:space-between;gap:12pt}

/* ── Bloc signatures ── */
.imprime-signature{display:none;margin-top:26pt;padding-top:4pt;gap:34pt;break-inside:avoid}
.imprime-signature>div{flex:1;text-align:center}
.imprime-signature .trait-sign{border-top:.75pt solid #333;margin:34pt 12pt 5pt}
.imprime-signature b{display:block;font-size:8.5pt;color:#1a1a1a}
.imprime-signature small{font-size:7.5pt;color:#666}
@media print{ .imprime-pied{display:flex !important} }
@media(prefers-reduced-motion:reduce){*{transition:none !important}}

/* Supabase ne renvoie qu'un nombre limité de lignes par requête (1000 par
   défaut) et TRONQUE SANS PRÉVENIR au-delà. Sur les tables qui grossissent
   (mouvements, pannes, messages…) cela rendrait le solde et les rapports
   silencieusement faux le jour où le plafond serait atteint.

   tout() redemande donc par tranches jusqu'à avoir la totalité. La 1re
   requête demande aussi le compte exact des lignes : on sait ainsi
   combien il en reste, quel que soit le plafond réglé côté serveur.

   L'argument est une FONCTION qui construit la requête, pas la requête
   elle-même : un constructeur Supabase ne peut servir qu'une fois, il faut
   pouvoir en fabriquer un neuf à chaque tranche.
     ex. tout(o => sb.from("sb2_mouvements").select("*", o).order("date"))

   La valeur de retour garde la forme {data, error} des requêtes normales,
   pour que le reste du code n'ait rien à changer. */
const PAGE = 1000;
async function tout(construire){
  const premier = await construire({count:"exact"}).range(0, PAGE-1);
  if(premier.error) return premier;
  const lignes = premier.data || [];
  const total = premier.count ?? lignes.length;
  while(lignes.length < total){
    const suite = await construire({}).range(lignes.length, lignes.length + PAGE - 1);
    if(suite.error) return suite;
    const lot = suite.data || [];
    if(!lot.length) break;          /* sécurité : jamais de boucle infinie */
    lignes.push(...lot);
  }
  return { data: lignes, error: null };
}

/* --- caisse, calculée localement pour rester réactive --- */
function caisse(){
  let rec=0,dg=0,ouv=0,rep=0,ext=0;
  for(const m of D.mouvements){
    const v=Number(m.montant)||0;
    if(m.sens==="entree"){ if(m.source==="dg") dg+=v; else if(m.source==="ouverture") ouv+=v; else rec+=v; }
    else { if(m.nature==="flotte") rep+=v; else ext+=v; }
  }
  const solde=rec+dg+ouv-rep-ext;
  const partFlotte=Math.max(0,dg-rep);
  const terminees=D.pannes.filter(p=>p.statut==="terminee");
  const engage=terminees.reduce((s,p)=>s+(Number(p.estimation)||0),0);
  const sansEst=terminees.filter(p=>p.estimation===null||p.estimation===undefined).length;
  return { solde, recettes:rec, dg, ouverture:ouv, reparations:rep, externes:ext,
    partFlotte, partLibre:solde-partFlotte, engage, nbARegler:terminees.length,
    sansEstimation:sansEst, previsionnel:solde-engage,
    seuil:Number(D.prefs.seuil)||0, sousSeuil:solde<=(Number(D.prefs.seuil)||0),
    libreNegatif:(solde-partFlotte)<0 };
}
function referenceSablier(){
  const ms=[...D.mouvements].sort((a,b)=>a.date.localeCompare(b.date));
  const limite=ajoutJours(auj(),-120); let cum=0,haut=0;
  for(const m of ms){ cum += (m.sens==="entree"?1:-1)*(Number(m.montant)||0);
    if(m.date>=limite && cum>haut) haut=cum; }
  return Math.max(haut, caisse().solde, (Number(D.prefs.seuil)||0)*3, 1);
}
function recetteJour(camionId){
  let total=0; const dates={};
  for(const m of D.mouvements)
    if(m.sens==="entree" && m.source==="recette" && m.camion_id===camionId){
      total+=Number(m.montant)||0; dates[m.date]=1;
    }
  const n=Object.keys(dates).length;
  return n ? total/(n*5) : 0;
}
const joursArret = p => (p.immobilise && p.immob_debut) ? joursOuvres(p.immob_debut, p.immob_fin) : 0;

function bilanCamion(id, d1, d2){
  let recette=0,pieces=0,mo=0,nbP=0,arret=0,externes=0;
  for(const m of D.mouvements){
    if(m.camion_id!==id) continue;
    if(d1&&m.date<d1) continue; if(d2&&m.date>d2) continue;
    if(m.sens==="entree" && m.source==="recette") recette+=Number(m.montant)||0;
    /* Dépenses externes rattachées à ce camion : carburant, pneus, TVM,
       assurance, lavage… Elles ne passent pas par une panne, mais elles
       coûtent bel et bien à ce camion-là. Sans elles, le net d'un camion
       était plus flatteur que la réalité. */
    else if(m.sens==="sortie" && m.nature==="externe") externes+=Number(m.montant)||0;
  }
  for(const p of D.pannes){
    if(p.camion_id!==id || p.statut!=="payee") continue;
    const d=p.date_paiement;
    if(d1&&d<d1) continue; if(d2&&d>d2) continue;
    pieces+=Number(p.cout_pieces)||0; mo+=Number(p.cout_mo)||0; nbP++; arret+=joursArret(p);
  }
  const rj=recetteJour(id), manque=arret*rj;
  return { recette,pieces,mo,reparations:pieces+mo,nbPannes:nbP,arret,recetteJour:rj,manque,externes,
    coutReel:pieces+mo+manque+externes, net:recette-(pieces+mo+manque+externes) };
}
function aLache(p){
  if(!p.piece||p.statut!=="payee") return null;
  const np=normPiece(p.piece), dp=p.date_paiement; let best=null;
  for(const q of D.pannes){
    if(q.id===p.id||q.camion_id!==p.camion_id||normPiece(q.piece)!==np) continue;
    const dq=q.date_paiement||q.date_signalement.slice(0,10);
    if(dq<=dp) continue;
    const e=jrs(dp,dq);
    if(e<=(D.prefs.fenetre_retour||30) && (!best||e<best.ecart)) best={panne:q,ecart:e};
  }
  return best;
}
function estRetour(p){
  if(!p.piece) return null;
  const np=normPiece(p.piece), dp=p.date_paiement||p.date_signalement.slice(0,10); let best=null;
  for(const q of D.pannes){
    if(q.id===p.id||q.camion_id!==p.camion_id||normPiece(q.piece)!==np||q.statut!=="payee") continue;
    const dq=q.date_paiement;
    if(dq>=dp) continue;
    const e=jrs(dq,dp);
    if(e<=(D.prefs.fenetre_retour||30) && (!best||e<best.ecart)) best={panne:q,ecart:e};
  }
  return best;
}
function perfGarage(id){
  const inters=D.pannes.filter(p=>p.garage_id===id && p.statut==="payee");
  let pieces=0,mo=0,retours=0;
  for(const p of inters){ pieces+=Number(p.cout_pieces)||0; mo+=Number(p.cout_mo)||0; if(aLache(p)) retours++; }
  const n=inters.length, total=pieces+mo;
  return { nb:n,pieces,mo,total,moyen:n?total/n:0,retours,taux:n?retours/n*100:0,partMO:total?mo/total*100:0 };
}
function estimer(camionId, garageId, piece){
  const payees=D.pannes.filter(p=>p.statut==="payee");
  const moy = arr => arr.length ? Math.round(arr.reduce((s,p)=>s+coutPanne(p),0)/arr.length) : null;
  if(piece && garageId){
    const v=moy(payees.filter(p=>p.garage_id===garageId && normPiece(p.piece)===normPiece(piece)));
    if(v!==null) return v;
  }
  if(piece){
    const v=moy(payees.filter(p=>normPiece(p.piece)===normPiece(piece)));
    if(v!==null) return v;
  }
  const v=moy(payees.filter(p=>p.camion_id===camionId));
  return v!==null ? v : moy(payees);
}

/* La TVM n'a pas de date a saisir : son echeance est le 1er janvier.
   On regarde si un paiement a deja ete journalise cette annee civile
   pour savoir si l'echeance a deja ete honoree. */
function tvmPayeePour(camionId, annee){
  return D.mouvements.some(m =>
    m.sens==="sortie" && m.nature==="externe" && m.camion_id===camionId &&
    m.categorie==="TVM" && Number(m.date.slice(0,4))===annee);
}
function echeanceTVM(camionId){
  const an = Number(auj().slice(0,4));
  const anneeDue = tvmPayeePour(camionId, an) ? an+1 : an;
  return { date:`${anneeDue}-01-01`, annee:anneeDue };
}
function echeanceVisite(c){ return c.visite_technique_date ? ajoutMois(c.visite_technique_date,6) : null; }
function echeanceAssurance(c){ return c.assurance_date ? ajoutMois(c.assurance_date,12) : null; }

/* etat : aRenseigner | echue | proche | ok */
function statutEcheance(dateEcheance, delaiJours){
  if(!dateEcheance) return { etat:"aRenseigner" };
  const j = jrs(auj(), dateEcheance);
  if(j < 0) return { etat:"echue", jours:-j };
  if(j <= delaiJours) return { etat:"proche", jours:j };
  return { etat:"ok", jours:j };
}
/* Meme logique que statutEcheance mais au kilometrage : utilisee pour
   l'entretien preventif (vidange, pneus) plutot que pour une date fixe.
   Necessite un dernier releve de km sur le camion (c.km) pour se prononcer,
   sinon on demande de le renseigner, comme pour une date manquante. */
function statutEcheanceKm(kmActuel, kmDernier, intervalle, marge){
  if(kmDernier==null || !intervalle) return { etat:"aRenseigner" };
  const km = Number(kmActuel)||0;
  const prochain = Number(kmDernier) + Number(intervalle);
  const reste = prochain - km;
  if(reste <= 0) return { etat:"echue", reste:-reste };
  if(reste <= (marge||0)) return { etat:"proche", reste };
  return { etat:"ok", reste };
}

/* Un relevé de compteur trop vieux rend les alertes vidange/pneus peu
   fiables : le camion a roulé depuis, mais l'appli l'ignore. */
const JOURS_RELEVE_FIABLE = 30;
function releveAncien(c){
  return !c.km_maj_le || jrs(c.km_maj_le, auj()) > JOURS_RELEVE_FIABLE;
}

function documentsCamion(c){
  const dv = D.prefs.delai_visite_j ?? 45;
  const da = D.prefs.delai_assurance_j ?? 30;
  const dt = D.prefs.delai_tvm_j ?? 30;
  const tvm = echeanceTVM(c.id);
  const iv = D.prefs.intervalle_vidange_km ?? 8000, mv = D.prefs.marge_vidange_km ?? 800;
  const ip = D.prefs.intervalle_pneus_km ?? 40000, mp = D.prefs.marge_pneus_km ?? 3000;
  const vieux = releveAncien(c);
  return [
    { type:"visite", libelle:"Visite technique", echeance:echeanceVisite(c), ...statutEcheance(echeanceVisite(c), dv) },
    { type:"assurance", libelle:"Assurance", echeance:echeanceAssurance(c), ...statutEcheance(echeanceAssurance(c), da) },
    { type:"tvm", libelle:`TVM ${tvm.annee}`, echeance:tvm.date, ...statutEcheance(tvm.date, dt), tvmAnnee:tvm.annee },
    { type:"vidange", libelle:"Vidange", kmDernier:c.km_derniere_vidange, intervalle:iv, releveAncien:vieux,
      ...statutEcheanceKm(c.km, c.km_derniere_vidange, iv, mv) },
    { type:"pneus", libelle:"Pneus", kmDernier:c.km_derniers_pneus, intervalle:ip, releveAncien:vieux,
      ...statutEcheanceKm(c.km, c.km_derniers_pneus, ip, mp) }
  ];
}

/* Phrase lisible pour un document donne, utilisee dans le centre d'alertes
   et dans la fiche camion. */
function phraseDocument(camionNom, doc){
  if(doc.type==="tvm"){
    const base = `TVM ${doc.tvmAnnee} due au 1er janvier`;
    if(doc.etat==="echue") return `${base} — échue depuis ${doc.jours} j`;
    if(doc.etat==="proche") return `${base} — dans ${doc.jours} j`;
    return base;
  }
  if(doc.type==="vidange" || doc.type==="pneus"){
    if(doc.etat==="aRenseigner") return `${doc.libelle} — kilométrage à renseigner`;
    if(doc.etat==="echue") return `${doc.libelle} en retard de ${fmtKm(doc.reste)}`;
    if(doc.etat==="proche") return `${doc.libelle} dans ${fmtKm(doc.reste)}`;
    return `${doc.libelle} à jour`;
  }
  if(doc.etat==="echue") return `${doc.libelle} échue depuis ${doc.jours} j`;
  if(doc.etat==="proche") return `${doc.libelle} à renouveler dans ${doc.jours} j`;
  if(doc.etat==="aRenseigner") return `${doc.libelle} — date à renseigner`;
  return `${doc.libelle} à jour`;
}

/* Un seul indicateur pour la liste des camions : le pire des trois documents. */
function pireStatutDocuments(c){
  const ordre = { echue:3, proche:2, aRenseigner:1, ok:0 };
  return documentsCamion(c).reduce((pire,d) => ordre[d.etat]>ordre[pire.etat] ? d : pire,
    { etat:"ok" });
}

const TAG_DOC = { echue:"t-rouge", proche:"t-ocre", aRenseigner:"t-gris", ok:"t-vert" };
/* Texte court d'un badge : "j" pour les documents a date, "km" pour l'entretien
   preventif suivi au kilometrage (vidange, pneus). */
function texteDocument(doc){
  if(doc.etat==="aRenseigner") return doc.type==="vidange"||doc.type==="pneus" ? "km à renseigner" : "à renseigner";
  if(doc.etat==="echue") return "échue";
  if(doc.type==="vidange"||doc.type==="pneus") return fmtKm(doc.reste);
  return `${doc.jours} j`;
}
function badgeDocument(doc){
  if(doc.etat==="ok") return "";
  return `<span class="tag ${TAG_DOC[doc.etat]}" style="white-space:nowrap">${esc(texteDocument(doc))}</span>`;
}
/* Variante compacte, prefixee du document concerne — utile des qu'on affiche
   plusieurs badges cote a cote pour un meme camion, pour lever l'ambiguite. */
const ABREV_DOC = { visite:"VT", assurance:"Assur.", tvm:"TVM", vidange:"Vidange", pneus:"Pneus" };
function badgeDocumentEtiquete(doc){
  if(doc.etat==="ok") return "";
  return `<span class="tag ${TAG_DOC[doc.etat]}" style="white-space:nowrap">${ABREV_DOC[doc.type]} · ${esc(texteDocument(doc))}</span>`;
}

/* Construit la liste de ce qu'il faut traiter, classee par urgence reelle
   plutot que par categorie. Chaque tache porte un rang : plus il est bas,
   plus c'est urgent. On s'arrete a MAX_TACHES pour garder l'ecran lisible. */
const MAX_TACHES = 6;
function tachesDuJour(){
  const t = [];
  const actifs = D.camions.filter(c=>c.actif);
  const ec = enCours();

  /* 1. Un document echu ou sur le point de l'etre sur un camion qui roule :
        c'est ce qui bloque un chargement du jour au lendemain. */
  for(const c of actifs){
    const immo = D.pannes.some(p=>p.camion_id===c.id && p.immobilise && !p.immob_fin);
    for(const d of documentsCamion(c)){
      if(d.etat!=="echue" && d.etat!=="proche") continue;
      if(d.type==="vidange" || d.type==="pneus") continue; /* traites plus bas */
      const bloquant = !immo && d.etat==="echue";
      t.push({
        rang: bloquant ? 0 : 1,
        ton: d.etat==="echue" ? "" : "j",
        titre: `${c.nom} — ${d.libelle} ${d.etat==="echue" ? "échue" : `dans ${d.jours} j`}`,
        detail: immo ? "Camion déjà immobilisé" : "Camion en service — blocage à prévoir",
        action: () => { aller("camions"); setVue("detail", c.id); }
      });
    }
  }

  /* 2. Panne signalee depuis trop longtemps sans garage affecte. */
  for(const p of ec.filter(enRetard)){
    const h = Math.floor(heuresDepuis(p.date_signalement));
    t.push({
      rang: 2, ton: "",
      titre: `${nomCamion(p.camion_id)} — sans garage depuis ${h > 47 ? Math.floor(h/24)+" j" : h+" h"}`,
      detail: p.description ? p.description.slice(0,70) : "Aucun garage choisi",
      action: () => ouvrirPanne(p.id)
    });
  }

  /* 3. Les autres pannes encore a affecter. */
  for(const p of ec.filter(p=>p.statut==="signalee" && !enRetard(p))){
    t.push({
      rang: 3, ton: "o",
      titre: `${nomCamion(p.camion_id)} — panne à affecter`,
      detail: p.description ? p.description.slice(0,70) : "Choisir un garage",
      action: () => ouvrirPanne(p.id)
    });
  }

  /* 4. Travaux termines dont le reglement reste en attente. */
  const aRegler = ec.filter(p=>p.statut==="terminee");
  if(aRegler.length) t.push({
    rang: 4, ton: "v",
    titre: `${aRegler.length} réparation${aRegler.length>1?"s":""} à régler`,
    detail: aRegler.map(p=>nomCamion(p.camion_id)).slice(0,4).join(" · "),
    action: () => aller("pannes")
  });

  /* 5. Camions au garage : a suivre, sans urgence immediate. */
  const auGarage = ec.filter(p=>p.statut==="affectee");
  if(auGarage.length){
    const noms = [...new Set(auGarage.map(p=>nomCamion(p.camion_id)))];
    t.push({
      rang: 5, ton: "o",
      titre: `${noms.length} camion${noms.length>1?"s":""} au garage`,
      detail: noms.slice(0,4).join(" · ") + (noms.length>4?` +${noms.length-4}`:""),
      action: () => aller("pannes")
    });
  }

  /* 6. Vidange ou pneus reellement depasses (le compteur est a jour). */
  const entretien = [];
  for(const c of actifs){
    if(releveAncien(c)) continue;
    for(const d of documentsCamion(c))
      if((d.type==="vidange"||d.type==="pneus") && d.etat==="echue")
        entretien.push(`${c.nom} (${d.libelle.toLowerCase()})`);
  }
  if(entretien.length) t.push({
    rang: 6, ton: "j",
    titre: `${entretien.length} entretien${entretien.length>1?"s":""} dépassé${entretien.length>1?"s":""}`,
    detail: entretien.slice(0,3).join(" · "),
    action: () => aller("camions")
  });

  /* 7. Compteurs jamais releves : les alertes ci-dessus sont aveugles. */
  const vieux = actifs.filter(releveAncien);
  if(vieux.length) t.push({
    rang: 7, ton: "j",
    titre: `${vieux.length} compteur${vieux.length>1?"s":""} à relever`,
    detail: "Sans relevé récent, les alertes vidange et pneus restent muettes",
    action: () => aller("camions")
  });

  t.sort((a,b)=>a.rang-b.rang);
  return t;
}

/* Le dictionnaire des actions est reconstruit a chaque rendu : les
   onclick du HTML n'y renvoient que par un index. */
let ACTIONS_BORD = [];
window.tacheBord = i => ACTIONS_BORD[i] && ACTIONS_BORD[i]();

function vBord(){
  const c=caisse(), max=referenceSablier();
  const pct=Math.max(0,Math.min(1, max ? c.solde/max : 0));
  const actifs=D.camions.filter(x=>x.actif);

  /* ── Bloc 1 : à traiter aujourd'hui ──
     La liste est déjà triée par urgence réelle (tachesDuJour). Seule la
     toute première ligne porte la couleur d'alerte, et seulement si elle
     est vraiment bloquante (ton==="") — pas juste parce qu'elle est en tête. */
  const taches=tachesDuJour();
  ACTIONS_BORD = taches.map(x=>x.action);
  let listeTaches="";
  taches.slice(0, MAX_TACHES).forEach((x,i)=>{
    const urgent = i===0 && x.ton==="";
    listeTaches+=`<div class="bord-tache ${urgent?"premier":x.ton}" onclick="tacheBord(${i})">
      <div class="bord-tache-num">${i+1}</div>
      <div class="bord-tache-txt"><b>${esc(x.titre)}</b><small>${esc(x.detail)}</small></div>
    </div>`;
  });
  if(taches.length > MAX_TACHES)
    listeTaches+=`<div class="bord-tache-plus">+ ${taches.length-MAX_TACHES} autre${
      taches.length-MAX_TACHES>1?"s":""} point${taches.length-MAX_TACHES>1?"s":""} à traiter</div>`;
  if(!taches.length)
    listeTaches=`<div class="bord-tache v"><div class="bord-tache-num">✓</div>
      <div class="bord-tache-txt"><b>Rien d'urgent</b>
      <small>Aucune panne en cours, aucun document échu.</small></div></div>`;

  /* ── Bloc 2 : caisse ── */
  const recSem=D.mouvements.filter(m=>m.sens==="entree"&&m.source==="recette"&&m.date>=lundiDe(auj()))
    .reduce((s,m)=>s+Number(m.montant),0);
  const CIRC=2*Math.PI*25;
  const couleurAnneau = c.sousSeuil ? "var(--minium)" : pct<0.4 ? "var(--sable)" : "var(--vert)";

  /* ── Bloc 3 : flotte, camions à problème en tête ── */
  const rangs=[];
  for(const cam of actifs){
    const pImmo=D.pannes.find(p=>p.camion_id===cam.id&&p.immobilise&&!p.immob_fin);
    const pOuv=D.pannes.find(p=>p.camion_id===cam.id&&["signalee","affectee"].includes(p.statut));
    const docPire=documentsCamion(cam).find(d=>d.etat==="echue")
                || documentsCamion(cam).find(d=>d.etat==="proche");
    /* pt : couleur du point de statut. Minium seulement quand quelque chose
       t'attend (aucun garage choisi, ou document échu) ; sable quand c'est
       déjà pris en charge (garage affecté) ; gris pour le reste, sans alarme. */
    let cls="ok", pt="g", etat="En route", tonEtat="", court="";
    if(pImmo){
      cls="immo"; tonEtat="r";
      const g=pOuv&&pOuv.garage_id ? nomGarage(pOuv.garage_id) : null;
      etat = g ? `Immobilisé · chez ${g}` : `Immobilisé · ${joursArret(pImmo)} j sans garage`;
      pt = g ? "s" : "m";
      court = g ? "Immobilisé" : "Sans garage";
    } else if(pOuv){
      cls="panne"; tonEtat="o";
      etat = pOuv.garage_id ? `Au garage · ${nomGarage(pOuv.garage_id)}` : "Panne à affecter";
      pt = pOuv.garage_id ? "s" : "m";
      court = pOuv.garage_id ? "Au garage" : "À affecter";
    } else if(docPire && docPire.etat==="echue"){
      cls="panne"; tonEtat="r"; pt="m";
      etat = `${docPire.libelle} échue`;
      court = docPire.libelle;
    } else if(docPire){
      cls="ok"; tonEtat="";
      etat = docPire.type==="vidange"||docPire.type==="pneus"
        ? `${docPire.libelle} dans ${fmtKm(docPire.reste)}`
        : `${docPire.libelle} dans ${docPire.jours} j`;
    }
    rangs.push({cam, cls, pt, etat, tonEtat, court,
      poids: pImmo?0 : pOuv?1 : (docPire&&docPire.etat==="echue")?2 : docPire?3 : 4});
  }
  rangs.sort((a,b)=>a.poids-b.poids || a.cam.nom.localeCompare(b.cam.nom));
  const nbImmo=new Set(D.pannes.filter(p=>p.immobilise&&!p.immob_fin).map(p=>p.camion_id)).size;
  const nbRoute=actifs.length-nbImmo;

  let flotte="";
  for(const r of rangs)
    flotte+=`<div class="bord-vig ${r.court?"alerte":""}" onclick="aller('camions');setVue('detail','${r.cam.id}')">
      <div class="bord-vig-pt ${r.pt}"></div>
      <div class="bord-vig-nom">${esc(r.cam.nom)}</div>
      ${r.court ? `<div class="bord-vig-et ${r.tonEtat}">${esc(r.court)}</div>` : ""}
    </div>`;

  /* ── Bloc collecte de la semaine ──
     Un camion immobilisé n'a pas de recette à attendre : on ne le compte
     ni dans les manquants, ni dans les barres. Sinon il ferait croire à
     un oubli de saisie chaque semaine. */
  const lundiCur = lundiDe(auj());
  const horsService = c => D.pannes.some(p=>p.camion_id===c.id && p.immobilise && !p.immob_fin);
  const attendus = actifs.filter(c=>!horsService(c));
  const recSemaine = attendus.map(c=>({
    nom: c.nom,
    montant: Number(recetteSemaine(c.id, lundiCur)?.montant || 0)
  }));
  const nbEncaisses = recSemaine.filter(r=>r.montant>0).length;
  const restants = attendus.length - nbEncaisses;

  /* Le bandeau n'apparaît qu'en fin de semaine, ou dès que la collecte a
     commencé. Affiché en permanence dès le lundi, il deviendrait du décor. */
  const jourSem = new Date(auj()+"T12:00:00").getDay();
  const finSemaine = jourSem===5 || jourSem===6 || jourSem===0;
  const montrerCollecte = admin() && restants>0 && (finSemaine || nbEncaisses>0);
  const bandeauCollecte = montrerCollecte
    ? `<div class="bord-collecte z-collecte" onclick="aller('vendredi')">
        <b>Collecte de la semaine · ${restants} camion${restants>1?"s":""} restant${restants>1?"s":""}</b>
        <i>→</i></div>`
    : "";

  const maxRec = Math.max(1, ...recSemaine.map(r=>r.montant));
  const totalRec = recSemaine.reduce((s,r)=>s+r.montant,0);
  let barres="";
  for(const r of recSemaine)
    barres+=`<div class="bord-barre ${r.montant?"":"vide"}"
      style="height:${r.montant ? Math.max(6, Math.round(r.montant/maxRec*100)) : 6}%"
      title="${esc(r.nom)} · ${r.montant ? fmt(r.montant) : "pas encore encaissé"}"></div>`;

  /* ── Bloc 4 : derniers mouvements ── */
  const derniers=[...D.mouvements].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,5);
  let mouv="";
  for(const m of derniers){
    const plus=m.sens==="entree";
    mouv+=`<div class="bord-mouv-item">
      <div><div class="bord-mouv-lib">${esc(m.libelle)}</div>
        <div class="bord-mouv-date">${dateCourte(m.date)} · ${esc(etiquetteMouvement(m))}</div></div>
      <div class="bord-mouv-val ${plus?"plus":"moins"}">${plus?"+":"−"}${fmt(m.montant)}</div>
    </div>`;
  }
  if(!derniers.length) mouv=`<div style="color:#5a5a6a;font-size:11px;padding:8px 0">Aucun mouvement enregistré.</div>`;

  /* ── Actions ── */
  let btns="";
  if(admin()) btns=`<div class="bord-btn-grid z-btns">
    <button class="bord-btn primary" onclick="formPanneAdmin()">＋ Panne</button>
    <button class="bord-btn sec" onclick="formSortie()">Dépense</button>
    <button class="bord-btn sec" onclick="formApportDG()">Apport DG</button>
    <button class="bord-btn sec" onclick="aller('vendredi')">Collecte</button>
    <button class="bord-btn full" onclick="formRecapWeekend()">📊 Récap du weekend → DG</button>
  </div>`;

  /* L'ordre du HTML ci-dessous est celui du TÉLÉPHONE. Sur ordinateur,
     la grille nommée de .bord-wrap replace les blocs en deux colonnes
     sans qu'on ait à dupliquer le balisage. */
  return `<div class="bord-wrap">
  ${bandeauCollecte}

  <div class="bord-caisse z-caisse">
    <div>
      <div class="bord-caisse-lbl">En caisse</div>
      <div class="bord-caisse-val">${fmtF(c.solde)}</div>
      <div class="bord-caisse-sub ${c.sousSeuil?"alerte":""}">${
        c.sousSeuil ? `Sous le seuil de ${fmtF(c.seuil)}`
        : `+${fmtF(recSem)} cette semaine`}</div>
    </div>
    <svg class="bord-caisse-anneau" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="25" fill="none" stroke="var(--ciment-fonce)" stroke-width="6"/>
      <circle cx="30" cy="30" r="25" fill="none" stroke="${couleurAnneau}" stroke-width="6"
        stroke-dasharray="${CIRC.toFixed(1)}"
        stroke-dashoffset="${(CIRC*(1-pct)).toFixed(1)}"
        stroke-linecap="round" transform="rotate(-90 30 30)"/>
      <text x="30" y="34" text-anchor="middle" font-family="Archivo" font-size="12" font-weight="800"
        fill="#1B2660">${Math.round(pct*100)}%</text>
    </svg>
  </div>

async function chargerMedias(id){
  const z=document.getElementById("med-"+id); if(!z) return;

  for(const m of med){

    html += data?.signedUrl ? `<a href="${data.signedUrl}" target="_blank" rel="noopener">${lbl}</a>`

/* ================= Discussion attachée à une panne =================
   Un fil par panne, partagé entre admin, chauffeur et garage. Se ferme
   tout seul côté base de données dès que la panne est payée — ici on ne
   fait que refléter cet état, sans le décider. */
const LIBELLE_ROLE_MSG = {admin:"Admin", chauffeur:"Chauffeur", garage:"Garage"};

window.ouvrirDiscussion = (panneId, role, retour) => {
  const nomCam = { admin: () => nomCamion((D.pannes.find(x=>x.id===panneId)||{}).camion_id),
                    chauffeur: () => (C.camions[0]||{}).nom || "votre camion",
                    garage: () => camionG((G.pannes.find(x=>x.id===panneId)||{}).camion_id) }[role]();
  ouvrir("Discussion — " + nomCam, `
    ${retour ? `<button class="btn sec mini no-print" style="margin-bottom:11px" onclick="${retour}">← Retour</button>` : ""}
    <div id="msg-liste" class="carte fil-msg"><div class="vide">Chargement…</div></div>
    <div id="msg-zone"></div>
    <div id="msg-erreur"></div>`,
    () => chargerDiscussion(panneId, role));
};

async function chargerDiscussion(panneId, role){
  const [{ data: p }, { data: msgs, error }] = await Promise.all([
    sb.from("sb2_pannes").select("statut").eq("id", panneId).single(),
    sb.from("sb2_messages").select("*").eq("panne_id", panneId).order("cree_le")
  ]);
  const zone = document.getElementById("msg-liste");
  if(!zone) return; // la modale a été fermée entre-temps
  if(error){ zone.innerHTML = `<div class="vide">Impossible de charger la discussion.</div>`; return; }

  zone.innerHTML = "";
  (msgs||[]).forEach(m => ajouterBulle(m, role));
  if(!(msgs||[]).length) zone.innerHTML = `<div class="vide">Aucun message pour l'instant.</div>`;
  zone.scrollTop = zone.scrollHeight;

  // Marque comme lu tout ce qui ne vient pas de nous.
  const col = COL_LU[role];
  const nonLus = (msgs||[]).filter(m => m.expediteur_role!==role && !m[col]).map(m=>m.id);
  if(nonLus.length) await sb.from("sb2_messages").update({[col]:true}).in("id", nonLus);

  const ferme = !p || p.statut === "payee";
  document.getElementById("msg-zone").innerHTML = ferme
    ? `<div class="alerte a-verte" style="margin-top:2px"><div>
        <b>Discussion clôturée</b>La panne est réglée, l'échange reste consultable mais on ne peut plus écrire.</div></div>`
    : `<div class="duo" style="margin-top:2px">
        <input id="msg-texte" placeholder="Écrire un message…" maxlength="2000" style="flex:1">
        <button class="btn mini" style="width:auto" id="msg-envoyer" onclick="envoyerMessage('${panneId}','${role}')">Envoyer</button>
      </div>`;
  const champ = document.getElementById("msg-texte");
  if(champ) champ.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); envoyerMessage(panneId, role); } };

  // Abonnement temps réel : les nouveaux messages apparaissent sans réouvrir la modale.
  if(canalMessagerie) sb.removeChannel(canalMessagerie);
  canalMessagerie = sb.channel("messages-"+panneId)
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"sb2_messages", filter:"panne_id=eq."+panneId},
      payload => {
        const liste = document.getElementById("msg-liste");
        if(!liste) return;
        if(payload.new.expediteur_role === role) return; // déjà affiché en local à l'envoi
        ajouterBulle(payload.new, role);
        liste.scrollTop = liste.scrollHeight;
        sb.from("sb2_messages").update({[col]:true}).eq("id", payload.new.id);
      })
    .subscribe();
}

function ajouterBulle(m, role){
  const zone = document.getElementById("msg-liste"); if(!zone) return;
  if(zone.querySelector(".vide")) zone.innerHTML = "";
  const mine = m.expediteur_role === role;
  const div = document.createElement("div");
  div.className = "bulle-msg" + (mine ? " moi" : "");
  div.innerHTML = `${mine ? "" : `<div class="bulle-aut">${esc(LIBELLE_ROLE_MSG[m.expediteur_role]||m.expediteur_role)}</div>`}
    <div class="bulle-corps"></div>
    <div class="bulle-heure">${heureCourte(m.cree_le)}</div>`;
  div.querySelector(".bulle-corps").textContent = m.contenu; // jamais de innerHTML sur un texte saisi par un tiers
  zone.appendChild(div);
}

window.envoyerMessage = async (panneId, role) => {
  const champ = document.getElementById("msg-texte");
  if(!champ) return;
  const contenu = champ.value.trim();
  if(!contenu) return;
  const btn = document.getElementById("msg-envoyer");
  champ.disabled = true; if(btn) btn.disabled = true;
  const { data, error } = await sb.from("sb2_messages")
    .insert({panne_id:panneId, expediteur_role:role, contenu}).select().single();
  champ.disabled = false; if(btn) btn.disabled = false;
  const err = document.getElementById("msg-erreur");
  if(error){
    if(err) err.innerHTML = `<div class="alerte a-rouge"><div>Message non envoyé : ${esc(error.message)}</div></div>`;
    return;
  }
  if(err) err.innerHTML = "";
  champ.value = ""; champ.focus();
  ajouterBulle(data, role);
  prevenir(panneId, "message");
  const liste = document.getElementById("msg-liste");
  if(liste) liste.scrollTop = liste.scrollHeight;
};

window.validerPanneAdmin = async () => {
  /* Aucun camion présélectionné : sans ce contrôle, une panne partirait
     silencieusement sur le premier camion de la liste. */
  if(!val("n-camion")) return toast("Choisis d'abord le camion concerné.");
  const immo=valSegm("n-immo")==="1";
  const b=document.getElementById("n-envoyer");
  if(b){ b.disabled=true; b.textContent="Envoi…"; }

  /* .select().single() : on a besoin de l'identifiant de la panne créée
     pour y rattacher les fichiers. Sans lui, impossible de construire
     le chemin de stockage. */
  const {data,error}=await sb.from("sb2_pannes").insert({
    camion_id:val("n-camion"), statut:"signalee", nature:valSegm("n-nature"),
    description:val("n-desc").trim(), immobilise:immo, immob_debut:immo?auj():null
  }).select().single();

  if(error){
    if(b){ b.disabled=false; b.textContent="Enregistrer"; }
    return toast("Échec : "+error.message);
  }

  /* La panne est enregistrée : à partir d'ici, plus rien ne doit la
     remettre en cause. Un fichier qui échoue est signalé, pas fatal. */
  let ratés=0;
  for(const f of piecesJointes){
    try{
      const ext={photo:"jpg",audio:"webm",video:"mp4"}[f.genre];
      const chemin=`${data.id}/${crypto.randomUUID()}.${ext}`;
      const up=await sb.storage.from("sb2-medias").upload(chemin,f.blob,{contentType:f.blob.type});
      if(up.error) throw up.error;
      await sb.from("sb2_medias").insert({panne_id:data.id, genre:f.genre,
        chemin, taille:f.blob.size, duree_s:f.duree||null});
    }catch(e){ ratés++; console.warn("Pièce non envoyée :", e); }
  }
  piecesJointes=[];

  fermer();
  toast(ratés ? `Panne enregistrée, mais ${ratés} pièce${ratés>1?"s":""} non envoyée${ratés>1?"s":""}.`
              : "Panne enregistrée.");

function vPannes(){
  const f=etatVue.filtre||"cours";
  let h = `<div class="onglets no-print">${
    [["cours","En cours"],["payees","Payées"],["tout","Toutes"]].map(x=>
      `<button class="${f===x[0]?"on":""}" onclick="setVue('filtre','${x[0]}')">${x[1]}</button>`).join("")}</div>`;
  if(admin()) h += `<button class="btn no-print" style="margin-bottom:12px" onclick="formPanneAdmin()">Noter une panne</button>`;

  if(f==="cours"){
    /* Groupées par ce qu'elles attendent de toi, plutôt que par statut
       technique : choisir un garage, patienter, ou payer. */
    const ec = enCours();
    const aAffecter = ec.filter(p=>p.statut==="signalee");
    const auGarage  = ec.filter(p=>p.statut==="affectee");
    const aRegler   = ec.filter(p=>p.statut==="terminee");
    h += `<div class="carte">`;
    if(!ec.length) h += `<div class="vide"><b>Aucune panne en cours</b>Rien à afficher ici.</div>`;
    if(aAffecter.length){
      h += `<div class="grp"><span>À affecter à un garage</span><b>${aAffecter.length}</b></div>`;
      for(const p of aAffecter) h += lignePanne(p);
    }
    if(auGarage.length){
      h += `<div class="grp"><span>Au garage</span><b>${auGarage.length}</b></div>`;
      for(const p of auGarage) h += lignePanne(p);
    }
    if(aRegler.length){
      h += `<div class="grp"><span>Terminées, en attente de règlement</span><b>${aRegler.length}</b></div>`;
      for(const p of aRegler) h += lignePanne(p);
    }
    h += `</div>`;
  } else {
    const liste = f==="payees" ? D.pannes.filter(p=>p.statut==="payee") : D.pannes;
    h += `<div class="carte">`;
    if(!liste.length) h += `<div class="vide"><b>Aucune panne</b>Rien à afficher ici.</div>`;
    else for(const p of liste){
      if(p.statut==="payee"){
        const r=aLache(p);
        h += `<div class="ligne" style="cursor:pointer" onclick="ouvrirPanne('${p.id}')">
          <div class="lib"><b class="im">${esc(nomCamion(p.camion_id))}</b>${r?' <span class="tag t-rouge">a lâché</span>':""}
          <small>${esc(p.piece||p.type)} · ${esc(nomGarage(p.garage_id))} · ${dateCourte(p.date_paiement)}</small></div>
          <span class="num">${fmt(coutPanne(p))}</span></div>`;
      } else h += lignePanne(p);
    }
    h += `</div>`;
  }
  return h;
}

/* ================= 9. VENDREDI ================= */
/* La recette d'un camion existant pour une semaine donnée, ou null.
   La clé est camion + semaine, jamais camion + date : une seconde saisie
   dans la même semaine corrige la première, elle ne s'y ajoute pas. */
function recetteSemaine(camionId, lundi){
  const dimanche = ajoutJours(lundi, 6);
  const trouvees = D.mouvements.filter(m =>
    m.sens === "entree" && m.source === "recette" && m.camion_id === camionId &&
    m.date >= lundi && m.date <= dimanche);
  if(!trouvees.length) return null;
  // s'il existe malgré tout plusieurs lignes (saisies avant ce correctif),
  // on prend la plus récente et on avertit dans le libellé au moment d'agir dessus.
  return trouvees.sort((a,b) => (b.created_at||"").localeCompare(a.created_at||""))[0];
}

function vVendredi(){
  if(!admin()) return `<div class="carte"><div class="vide"><b>Réservé à l'administrateur</b>La collecte est saisie par SARANA.</div></div>`;
  const actifs=D.camions.filter(c=>c.actif);
  if(!actifs.length) return `<div class="carte"><div class="vide"><b>Aucun camion actif</b></div></div>`;

  const ancre = etatVue.semaineCollecte || auj();
  const lundi = lundiDe(ancre);
  const dimanche = ajoutJours(lundi, 6);

  const semaineEnCours = lundi === lundiDe(auj());
  let h = `<div class="titre-sec">Collecte de la semaine</div>
    <div class="carte">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <button class="btn sec" style="min-width:0;width:52px;padding:11px 0;font-size:18px"
          onclick="setVue('semaineCollecte','${ajoutJours(lundi,-7)}')" aria-label="Semaine précédente">←</button>
        <div style="flex:1;text-align:center">
          <b style="display:block">${dateCourte(lundi)} → ${dateCourte(dimanche)}</b>
          <small class="mt">${semaineEnCours ? "Semaine en cours" : "Semaine " + numSemaine(lundi)}</small>
        </div>
        <button class="btn sec" style="min-width:0;width:52px;padding:11px 0;font-size:18px"
          onclick="setVue('semaineCollecte','${ajoutJours(lundi,7)}')" aria-label="Semaine suivante">→</button>
      </div>
      ${semaineEnCours ? "" : `<button class="btn sec" style="width:100%;margin-bottom:10px"
        onclick="setVue('semaineCollecte','${auj()}')">Revenir à la semaine en cours</button>`}
      <label class="ch" style="margin-bottom:0"><span>Aller à une semaine précise</span>
        <input type="date" id="c-saut" value="${lundi}" onchange="setVue('semaineCollecte', this.value)"></label>
      <p class="mt" style="margin-top:9px">Touche un camion déjà encaissé pour corriger son montant.</p>
    </div>`;

  const saisis = actifs.filter(c => recetteSemaine(c.id, lundi));
  h += `<div class="carte" style="padding:9px 14px 4px"><div class="lib" style="display:flex;justify-content:space-between">
    <b>${saisis.length} camion${saisis.length>1?"s":""} sur ${actifs.length} encaissé${saisis.length>1?"s":""}</b></div></div>`;

  /* Un camion immobilisé n'a pas de recette à attendre : le séparer
     évite de se demander pourquoi il « manque » à l'appel. Le champ de
     saisie reste disponible pour les deux groupes — rien n'est retiré,
     seul l'affichage est réorganisé. */
  const horsService = c => D.pannes.some(p=>p.camion_id===c.id && p.immobilise && !p.immob_fin);
  const disponibles = actifs.filter(c=>!horsService(c));
  const indisponibles = actifs.filter(horsService);
  const ligneCollecte = c => {
    const ch = chauffeurDe(c.id, dimanche);
    const r = recetteSemaine(c.id, lundi);
    if(r){
      return `<div class="ligne" style="cursor:pointer;align-items:center" onclick="corrigerRecette('${r.id}','${c.id}','${lundi}')">
        <div class="lib"><b class="im">${esc(c.nom)}</b>
          <small>${ch?esc(ch.nom):"sans chauffeur"} · saisi ${r.date===auj()?"aujourd'hui":dateCourte(r.date)}</small></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="num" style="font-weight:700">${fmt(r.montant)}</span>
          <span class="tag t-vert">encaissé</span></div></div>`;
    }
    return `<div class="ligne" style="align-items:center">
      <div class="lib"><b class="im">${esc(c.nom)}</b><small>${ch?esc(ch.nom):"sans chauffeur"}</small></div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="number" inputmode="numeric" class="c-montant" data-c="${c.id}"
          placeholder="Recette" min="0" style="width:118px;text-align:right">
        <span class="tag t-gris">en attente</span></div></div>`;
  };

  h += `<div class="carte" style="padding-top:6px">`;
  if(disponibles.length){
    h += `<div class="grp"><span>Recettes attendues</span><b>${disponibles.length}</b></div>`;
    for(const c of disponibles) h += ligneCollecte(c);
  }
  if(indisponibles.length){
    h += `<div class="grp"><span>Au garage — recette possible si déjà remise</span><b>${indisponibles.length}</b></div>`;
    for(const c of indisponibles) h += ligneCollecte(c);
  }
  const restants = actifs.length - saisis.length;
  if(restants > 0){
    h += `<div class="ligne" style="border-bottom:0;padding-top:14px"><div class="lib"><b>Nouvelles saisies</b>
      <small>Camions encore en attente ci-dessus</small></div>
      <span class="num" id="c-total" style="font-size:20px;font-weight:700">0 F</span></div>
      <button class="btn" style="width:100%" onclick="validerCollecte(\'${lundi}\')">Enregistrer</button>`;
  } else {
    h += `<div class="ligne" style="border-bottom:0;padding-top:6px"><div class="lib">
      <b>Tous les camions sont encaissés</b><small>Touche une ligne ci-dessus pour corriger un montant.</small></div></div>`;
  }
  h += `</div>`;
  return h;
}
window.apres_vendredi = () => {

    const z=document.getElementById("c-total"); if(z) z.textContent=fmtF(t);
  };
  document.querySelectorAll(".c-montant").forEach(i=>i.addEventListener("input",maj));

/* La recette doit porter une date DANS la semaine affichee, sinon elle
   bascule dans une autre semaine et le camion reste "en attente" —
   c'est ce qui provoquait les doubles saisies. */
function dateDansSemaine(lundi){
  const dimanche = ajoutJours(lundi, 6);
  const jour = auj();
  if(jour >= lundi && jour <= dimanche) return jour;
  return ajoutJours(lundi, 4);   // le vendredi de cette semaine-la
}

window.validerCollecte = async (lundi) => {
  lundi = lundi || lundiDe(auj());
  const dateRecette = dateDansSemaine(lundi);
  const nouvelles = [], corrections = [];

  document.querySelectorAll(".c-montant").forEach(i=>{
    const v = Number(i.value) || 0;
    if(v <= 0) return;
    const camionId = i.dataset.c;
    // garde-fou : si une recette existe deja pour cette semaine, on corrige
    const existante = recetteSemaine(camionId, lundi);
    if(existante) corrections.push({ id:existante.id, montant:v });
    else nouvelles.push({ date:dateRecette, sens:"entree", source:"recette", montant:v,
      camion_id:camionId, libelle:"Recette "+nomCamion(camionId) });
  });

  if(!nouvelles.length && !corrections.length) return toast("Aucun montant saisi.");

  if(nouvelles.length){
    const {error} = await sb.from("sb2_mouvements").insert(nouvelles);
    if(error) return toast("Échec : "+error.message);
  }
  for(const c of corrections){
    const {error} = await sb.from("sb2_mouvements").update({montant:c.montant}).eq("id", c.id);
    if(error) return toast("Échec : "+error.message);
  }

  const n = nouvelles.length + corrections.length;
  toast(`${n} recette${n>1?"s":""} enregistrée${n>1?"s":""}.`);
  await recharger(); aller("bord");
};

/* Corriger une recette déjà saisie : un montant tapé de travers se répare
   ici, sans créer de seconde ligne et sans dupliquer la caisse. */
window.corrigerRecette = (mouvementId, camionId, lundi) => {
  const m = D.mouvements.find(x => x.id === mouvementId);
  if(!m) return;
  const dimanche = ajoutJours(lundi, 6);
  const autres = D.mouvements.filter(x =>
    x.sens==="entree" && x.source==="recette" && x.camion_id===camionId &&
    x.date>=lundi && x.date<=dimanche && x.id!==mouvementId);
  ouvrir("Corriger la recette",
    `<p class="mt" style="margin-bottom:12px">${esc(nomCamion(camionId))} — semaine du ${dateCourte(lundi)}</p>
     ${autres.length ? `<div class="alerte a-ocre"><div><b>Plusieurs saisies trouvées pour cette semaine</b>
       Une seule sera gardée ; les autres seront supprimées pour éviter un double compte.</div></div>` : ""}
     <label class="ch"><span>Montant encaissé</span>
       <input type="number" inputmode="numeric" id="cr-montant" value="${Math.round(m.montant)}"></label>
     <label class="ch"><span>Date de la saisie</span><input type="date" id="cr-date" value="${m.date}"></label>
     <div id="cr-msg"></div>
     <div class="duo" style="margin-bottom:9px"><button class="btn sec" onclick="fermer()">Annuler</button>
     <button class="btn" onclick="validerCorrectionRecette('${mouvementId}','${camionId}')">Enregistrer</button></div>
     <button class="btn danger" onclick="supprimerRecette('${mouvementId}','${camionId}')">Ce camion n'a rien rendu — supprimer</button>`,
    () => document.getElementById("cr-montant").addEventListener("input", function(){
      const v = Number(this.value)||0;
      const z = document.getElementById("cr-msg");
      z.innerHTML = v>=1000000
        ? `<div class="alerte a-ocre"><div><b>Montant élevé</b>${fmtF(v)} — vérifie qu'il n'y a pas un zéro de trop.</div></div>` : "";
    }));
};
window.validerCorrectionRecette = async (mouvementId, camionId) => {
  const v = Number(val("cr-montant"))||0;
  if(v<=0) return document.getElementById("cr-msg").innerHTML =
    `<div class="alerte a-rouge"><div>Le montant doit être supérieur à zéro. Utilise « supprimer » si le camion n'a rien rendu.</div></div>`;
  const d = val("cr-date") || auj();
  const lundi = lundiDe(d);
  const dimanche = ajoutJours(lundi, 6);
  const doublons = D.mouvements.filter(x =>
    x.sens==="entree" && x.source==="recette" && x.camion_id===camionId &&
    x.date>=lundi && x.date<=dimanche && x.id!==mouvementId).map(x=>x.id);
  if(doublons.length){
    const {error} = await sb.from("sb2_mouvements").delete().in("id", doublons);
    if(error) return toast("Échec : "+error.message);
  }
  const {error} = await sb.from("sb2_mouvements")
    .update({ montant:v, date:d, libelle:"Recette "+nomCamion(camionId) }).eq("id", mouvementId);
  if(error) return toast("Échec : "+error.message);
  fermer(); toast("Recette corrigée."); await recharger();
};
window.supprimerRecette = async (mouvementId, camionId) => {
  const lundi = lundiDe(D.mouvements.find(x=>x.id===mouvementId)?.date || auj());
  const dimanche = ajoutJours(lundi, 6);
  const ids = D.mouvements.filter(x =>
    x.sens==="entree" && x.source==="recette" && x.camion_id===camionId &&
    x.date>=lundi && x.date<=dimanche).map(x=>x.id);
  const {error} = await sb.from("sb2_mouvements").delete().in("id", ids);
  if(error) return toast("Échec : "+error.message);
  fermer(); toast("Recette supprimée."); await recharger();
};

/* ================= 10. CAISSE : SORTIES ET APPORTS ================= */
const CATEGORIES=["Besoin société","Avance personnel","Demande du DG","Abonnement","TVM","Visite technique","Assurance","Autre"];

/* Les catégories déjà saisies à la main, pour les resuggérer.
   On exclut celles de la liste fixe : elles sont déjà dans le menu. */
function categoriesLibres(){
  /* On regroupe sans tenir compte de la casse : sinon « Carburant » et
     « carburant » apparaîtraient comme deux suggestions distinctes, ce
     qui provoquerait précisément la dispersion qu'on veut éviter.
     On garde l'orthographe la plus souvent employée. */
  const comptes = new Map();
  for(const m of D.mouvements){
    const c = (m.categorie||"").trim();
    if(!c || c==="Autre" || CATEGORIES.includes(c)) continue;
    const cle = c.toLocaleLowerCase("fr");
    const e = comptes.get(cle) || {};
    e[c] = (e[c]||0) + 1;
    comptes.set(cle, e);
  }
  return [...comptes.values()]
    .map(e => Object.entries(e).sort((a,b)=>b[1]-a[1])[0][0])
    .sort((a,b)=>a.localeCompare(b,"fr"));
}

/* Leaflet.js charge dynamiquement depuis CDN la premiere fois.
   Ensuite il est cache par le navigateur. */
/* On mémorise la promesse elle-même, pas un drapeau : si l'utilisateur
   ouvre Carte deux fois de suite, le second appel attend le même
   chargement au lieu de croire à tort que Leaflet est déjà prêt. */
let LEAFLET_CHARGE = null;
function chargerLeaflet(){
  if(window.L) return Promise.resolve();
  if(LEAFLET_CHARGE) return LEAFLET_CHARGE;
  LEAFLET_CHARGE = new Promise((ok,ko)=>{
    const css=document.createElement("link");
    css.id="leaflet-css"; css.rel="stylesheet";
    css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const js=document.createElement("script");
    js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.onload=()=>ok();
    js.onerror=()=>{ LEAFLET_CHARGE=null; ko(new Error("Leaflet indisponible")); };
    document.head.appendChild(js);
  });
  return LEAFLET_CHARGE;
}

/* Couleur du marqueur selon l'activité du camion */
function couleurMarqueur(pos){
  if(!pos) return "#9AA0B4";                    // gris — jamais vu
  const minutesDepuis = (Date.now() - new Date(pos.created_at))/60000;
  if(minutesDepuis > 120) return "#9AA0B4";     // gris — hors ligne > 2h
  if(Number(pos.vitesse) > 2) return "#27368B"; // indigo DSN — en mouvement
  return "#D2A24C";                             // sable DSN — arrêté
}

  return `
    <div class="titre-sec" style="display:flex;align-items:center;justify-content:space-between">
      <span>Flotte — positions en temps réel</span>

    </div>
    <div id="carte-map" style="height:58vh;width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--filet);
      background:var(--ciment);display:flex;align-items:center;justify-content:center">
      <span style="color:var(--encre-doux);font-size:14px">Chargement de la carte…</span>
    </div>
    <div id="carte-liste" style="margin-top:12px"></div>`;
}

let carteL = null; /* instance Leaflet globale */
window.apres_carte = async () => {
  try {
    await chargerLeaflet();
  } catch(e) {
    document.getElementById("carte-map").innerHTML =
      `<div class="vide"><b>Carte indisponible</b>Vérifie ta connexion internet.</div>`;
    return;
  }
  /* Init ou réutilisation de la carte Leaflet */
  const el = document.getElementById("carte-map");
  el.style.cssText = "height:58vh;width:100%;border-radius:12px;overflow:hidden;";
  if(carteL){ carteL.remove(); carteL=null; }
  /* Cotonou centré */
  carteL = L.map("carte-map", { zoomControl:true }).setView([6.365, 2.418], 11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:18
  }).addTo(carteL);

  /* Recuperer les dernières positions depuis Supabase */
  const { data:positions } = await sb.from("sb2_derniere_position").select("*");
  const posMap = {};
  (positions||[]).forEach(p=>{ posMap[p.camion_id]=p; });

  /* Placer les marqueurs */
  const enLigne=[], horsLigne=[];
  for(const c of D.camions){
    if(!c.actif) continue;
    const pos = posMap[c.id];
    const ch = chauffeurDe(c.id);
    const couleur = couleurMarqueur(pos);
    if(pos){
      const icon = L.divIcon({
        className:"",
        html:`<div style="
          background:${couleur};color:#fff;border-radius:50% 50% 50% 0;
          width:36px;height:36px;display:flex;align-items:center;justify-content:center;
          font-size:10px;font-weight:700;border:2px solid #fff;
          box-shadow:0 2px 6px rgba(0,0,0,.35);transform:rotate(-45deg)">
          <span style="transform:rotate(45deg);text-align:center;line-height:1.1">${esc(c.nom.slice(0,6))}</span>
        </div>`,
        iconSize:[36,36], iconAnchor:[12,36], popupAnchor:[6,-36]
      });
      const minutesDepuis = Math.round((Date.now()-new Date(pos.created_at))/60000);
      const vitesse = Math.round(Number(pos.vitesse)||0);
      const marker = L.marker([pos.lat, pos.lng], {icon}).addTo(carteL);
      marker.bindPopup(`
        <b style="font-size:14px">${esc(c.nom)}</b><br>
        <span style="color:#555">${esc(c.modele||"")}</span><br><br>
        🧑 ${ch ? esc(ch.nom) : "—"}<br>
        🚛 ${vitesse > 2 ? vitesse+" km/h" : "À l'arrêt"}<br>
        🕐 Il y a ${minutesDepuis < 60 ? minutesDepuis+" min" : Math.round(minutesDepuis/60)+" h"}<br>
        📍 ${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}<br>
        ${pos.km_compteur ? "📟 "+fmtKm(pos.km_compteur) : ""}
      `);
      enLigne.push({c,pos,ch,couleur,vitesse,minutesDepuis});
    } else {
      horsLigne.push({c,ch});
    }
  }

  /* Ajuster le zoom si des positions existent */
  if(enLigne.length){
    const grp = L.featureGroup(
      enLigne.map(x=>L.marker([x.pos.lat,x.pos.lng]))
    );
