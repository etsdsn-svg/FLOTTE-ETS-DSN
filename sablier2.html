<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17453A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SABLIER">
<title>SABLIER — Flotte DSN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --vert:#17453A; --vert-clair:#2A6B57; --minium:#B4442A; --sable:#D2A24C;
  --ciment:#E4E4DF; --ciment-fonce:#CFD0C9; --encre:#14171A; --encre-doux:#5C6169;
  --craie:#fff; --r:10px; --nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ciment);color:var(--encre);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
.num{font-family:"Space Grotesk",system-ui,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:"Space Grotesk",system-ui,Arial,sans-serif;font-weight:700;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

#app{display:flex;flex-direction:column;min-height:100%}
#topbar{
  position:sticky;top:0;z-index:40;background:var(--vert);color:#fff;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;font-size:11.5px
}
#topbar .marque{font-family:"Space Grotesk";font-weight:700;font-size:15px;letter-spacing:.14em}
#topbar .solde-haut{display:none;align-items:baseline;gap:8px}
#topbar .solde-haut b{font-family:"Space Grotesk";font-size:17px;font-variant-numeric:tabular-nums}
#topbar .solde-haut span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
#topbar .cycle{margin-left:auto;display:flex;align-items:center;gap:7px;opacity:.95}
#topbar .etat{display:flex;align-items:center;gap:6px;padding-left:11px;margin-left:11px;border-left:1px solid rgba(255,255,255,.18);flex:none}
#topbar .etat .lbl{font-style:normal}
.pastille{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
#main{flex:1;padding:14px 14px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));max-width:1120px;width:100%;margin:0 auto}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--craie);
  border-top:1px solid var(--ciment-fonce);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9.5px;letter-spacing:-.01em;color:var(--encre-doux);font-weight:600;white-space:nowrap;
  border-top:2.5px solid transparent;margin-top:-1px}
#nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--vert);border-top-color:var(--vert)}
#nav .logo-nav{display:none}

.carte{background:var(--craie);border-radius:var(--r);padding:14px;margin-bottom:12px}
.titre-sec{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--encre-doux);margin:20px 0 9px}
.titre-sec:first-child{margin-top:0}
.ligne{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--ciment)}
.ligne:last-child{border-bottom:0}
.lib{min-width:0}
.lib b{display:block;font-weight:600}
.lib small{color:var(--encre-doux);font-size:12.5px}
.mt{color:var(--encre-doux);font-size:12.5px}
.vide{text-align:center;color:var(--encre-doux);padding:26px 12px;font-size:14px}
.vide b{display:block;color:var(--encre);font-weight:600;margin-bottom:4px}

/* sablier */
.sablier-bloc{background:var(--craie);border-radius:var(--r);padding:16px;margin-bottom:12px;display:flex;gap:18px}
.colonne{position:relative;width:60px;flex:none;height:186px;border-radius:6px;background:var(--ciment);
  overflow:hidden;border:1px solid var(--ciment-fonce)}
.remplissage{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;
  transition:height .55s cubic-bezier(.2,.7,.3,1)}
.p-libre{background:var(--sable)}
.p-flotte{background:var(--vert)}
.p-engage{background:repeating-linear-gradient(-45deg,#E8C489 0 5px,#D2A24C 5px 10px)}
.seuil{position:absolute;left:0;right:0;border-top:2px dashed var(--minium)}
.seuil span{position:absolute;right:2px;top:-14px;font-size:9px;font-weight:700;color:var(--minium);
  background:var(--craie);padding:0 3px;border-radius:2px}
.chiffres{flex:1;min-width:0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--encre-doux)}
.gros{font-size:29px;font-weight:700;line-height:1.05;margin:2px 0 1px;overflow-wrap:anywhere}
.moyen{font-size:20px;font-weight:700;line-height:1.15;color:var(--minium)}
.repart{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.repart div{display:flex;align-items:center;gap:8px;font-size:13px}
.repart b{margin-left:auto;font-family:"Space Grotesk";font-variant-numeric:tabular-nums;font-weight:600}
.puce{width:11px;height:11px;border-radius:3px;flex:none}

/* compteurs de suivi */
.etapes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.etape{background:var(--craie);border-radius:var(--r);padding:12px 8px;text-align:center}
.etape .n{font-family:"Space Grotesk";font-size:28px;font-weight:700;line-height:1}
.etape .t{font-size:10.5px;color:var(--encre-doux);font-weight:600;margin-top:3px}
.etape.urgent{background:#FBE9E4}
.etape.urgent .n{color:var(--minium)}

.alerte{border-radius:var(--r);padding:11px 13px;margin-bottom:12px;font-size:13.5px}
.alerte b{display:block;margin-bottom:2px}
.a-rouge{background:#FBE9E4;color:#7A2916;border-left:4px solid var(--minium)}
.a-ocre{background:#FAF0DC;color:#6B4B12;border-left:4px solid var(--sable)}
.a-verte{background:#E4F0EA;color:#123B30;border-left:4px solid var(--vert)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:8px;
  font-weight:600;font-size:14.5px;background:var(--vert);color:#fff;width:100%;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--craie);color:var(--encre);box-shadow:inset 0 0 0 1.5px var(--ciment-fonce)}
.btn.danger{background:var(--minium);color:#fff}
.btn.mini{width:auto;padding:7px 12px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}
.duo{display:flex;gap:9px}
.duo .btn{flex:1}

label.ch{display:block;margin-bottom:11px}
label.ch>span{display:block;font-size:12px;font-weight:600;color:var(--encre-doux);margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--ciment-fonce);border-radius:8px;
  background:var(--craie);font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--vert-clair);outline-offset:1px;border-color:var(--vert-clair)}
input[type=number]{font-family:"Space Grotesk";font-variant-numeric:tabular-nums}
.rang{display:flex;gap:9px}
.rang>*{flex:1;min-width:0}
.segm{display:flex;border:1.5px solid var(--ciment-fonce);border-radius:8px;overflow:hidden}
.segm button{flex:1;padding:10px 6px;font-size:13.5px;font-weight:600;color:var(--encre-doux);background:var(--craie)}
.segm button.on{background:var(--vert);color:#fff}
.segm.ocre button.on{background:var(--sable);color:#2C2205}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--encre-doux);
  padding:0 8px 7px 0;font-weight:700;border-bottom:1.5px solid var(--ciment-fonce)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--ciment);vertical-align:top}
th.n,td.n{text-align:right;padding-right:0}
td.n{font-family:"Space Grotesk";font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}

.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase}
.t-rouge{background:var(--minium);color:#fff}
.t-ocre{background:#FAF0DC;color:#6B4B12}
.t-vert{background:#E4F0EA;color:var(--vert)}
.t-gris{background:var(--ciment);color:var(--encre-doux)}

#modale{position:fixed;inset:0;z-index:80;background:rgba(20,23,26,.5);display:none;align-items:flex-end;justify-content:center}
#modale.on{display:flex}
#modale-in{background:var(--ciment);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
#modale-in h2{font-size:18px;margin-bottom:14px}
.poignee{width:38px;height:4px;background:var(--ciment-fonce);border-radius:2px;margin:0 auto 13px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px);z-index:90;
  background:var(--encre);color:#fff;padding:11px 17px;border-radius:9px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center}
#toast.on{opacity:1}

.onglets{display:flex;gap:6px;margin-bottom:13px;overflow-x:auto}
.onglets button{padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--craie);color:var(--encre-doux)}
.onglets button.on{background:var(--vert);color:#fff}

.medias{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.medias a{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:7px;
  background:var(--ciment);font-size:12px;font-weight:600;color:var(--encre);text-decoration:none}
.lien-copie{font-family:"Space Grotesk";font-size:11.5px;word-break:break-all;background:var(--ciment);
  padding:9px 10px;border-radius:7px;margin:7px 0;color:var(--encre-doux)}

#accueil{max-width:420px;margin:0 auto;padding:34px 18px}
#accueil .marque-g{font-family:"Space Grotesk";font-weight:700;font-size:23px;letter-spacing:.2em;
  color:var(--vert);text-align:center;margin-bottom:6px}
#accueil .sous{text-align:center;color:var(--encre-doux);font-size:13.5px;margin-bottom:22px}

@media(min-width:900px){
  #app{flex-direction:row;background:linear-gradient(to right,var(--craie) 0 212px,var(--ciment) 212px)}
  #nav{position:sticky;top:0;bottom:auto;height:100vh;width:212px;flex:none;flex-direction:column;
    border-top:0;border-right:1px solid var(--ciment-fonce);padding:14px 10px;gap:2px}
  #nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;padding:10px 12px;
    font-size:14px;border-top:0;border-left:3px solid transparent;border-radius:8px;margin-top:0}
  #nav button.on{border-left-color:var(--vert);background:#F2F5F3}
  #nav .logo-nav{display:block;padding:6px 12px 18px;font-family:"Space Grotesk";font-weight:700;
    font-size:16px;letter-spacing:.16em;color:var(--vert)}
  #zone{flex:1;min-width:0;display:flex;flex-direction:column}
  #topbar{padding:12px 26px}
  #topbar .marque{display:none}
  #topbar .solde-haut{display:flex}
  #main{padding:22px 26px 60px}
  .colonne{height:220px;width:70px}
  .sablier-bloc{max-width:560px}
  .scroll-x{margin:0;padding:0}
  .btn{width:auto;min-width:170px}
  .grille2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .grille2>*{margin-bottom:0}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:10.5pt}
  #nav,#topbar,.no-print,#toast,#modale{display:none !important}
  #main{padding:0;max-width:none}
  .carte{border:1px solid #bbb;break-inside:avoid;padding:9px;margin-bottom:8px}
  .scroll-x{overflow:visible;margin:0;padding:0}
  .imprime-entete{display:block !important}
}
.imprime-entete{display:none;border-bottom:2px solid #000;padding-bottom:7px;margin-bottom:12px}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<body>
<div id="racine"></div>
<div id="modale"><div id="modale-in"></div></div>
<div id="toast"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ================= 1. CONNEXION ================= */
const SB_URL = "https://glfffkmmhlrbvasiucok.supabase.co";
const SB_CLE = "sb_publishable_wEw9LFDHWcawi_89JvM63w_Jcn1g1pC";
const sb = createClient(SB_URL, SB_CLE, {
  auth:{ persistSession:true, autoRefreshToken:true, storageKey:"sablier2_auth" }
});
const CACHE = "sablier2_cache";

let moi = null;                 /* {role, nom, acteur_id, camion_id, camion_nom} */
let D = null;                   /* données chargées */
let vue = "bord";
let etatVue = {};
let enLigne = navigator.onLine;

/* ================= 2. OUTILS ================= */
const fmt = n => {
  n = Math.round(Number(n)||0);
  const neg = n<0; n = Math.abs(n);
  return (neg?"-":"") + String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
};
const fmtF = n => fmt(n) + " F";
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const auj = () => new Date().toISOString().slice(0,10);
const jrs = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const dateCourte = d => d ? (x=>x.getDate()+" "+MOIS[x.getMonth()].slice(0,4))(new Date(d.slice(0,10)+"T00:00:00")) : "—";
const dateLongue = d => d ? (x=>x.getDate()+" "+MOIS[x.getMonth()]+" "+x.getFullYear())(new Date(d.slice(0,10)+"T00:00:00")) : "—";
function joursOuvres(d1,d2){
  if(!d1) return 0;
  const a=new Date(d1.slice(0,10)+"T00:00:00"), b=new Date((d2||auj()).slice(0,10)+"T00:00:00");
  let n=0; if(b<a) return 0;
  while(a<=b){ const j=a.getDay(); if(j>=1&&j<=5) n++; a.setDate(a.getDate()+1); }
  return n;
}
const normPiece = p => String(p||"").toLowerCase().trim().replace(/\s+/g," ").replace(/s$/,"");
function lundiDe(d){ const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x.toISOString().slice(0,10); }
function numSemaine(d){ const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+4-((x.getDay()+6)%7));
  return Math.ceil((((x-new Date(x.getFullYear(),0,1))/86400000)+1)/7); }
function ajoutJours(d,n){ const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); }

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600);
}
function ouvrir(titre, corps, apres){
  const m=document.getElementById("modale"), i=document.getElementById("modale-in");
  i.innerHTML=`<div class="poignee"></div><h2>${esc(titre)}</h2>${corps}`;
  m.classList.add("on");
  m.onclick=e=>{ if(e.target===m) fermer(); };
  if(apres) apres();
}
const fermer = () => document.getElementById("modale").classList.remove("on");
window.fermer = fermer;

function segm(id, cb){
  const el=document.getElementById(id); if(!el) return;
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    el.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); if(cb) cb(b.dataset.v);
  });
}
const valSegm = id => document.getElementById(id)?.querySelector("button.on")?.dataset.v ?? null;
const val = id => document.getElementById(id)?.value ?? "";
const nb = id => Number(document.getElementById(id)?.value) || 0;

/* ================= 3. DONNÉES ================= */
const camion = id => D.camions.find(c=>c.id===id);
const garage = id => D.garages.find(g=>g.id===id);
const nomCamion = id => camion(id)?.nom ?? "—";
const nomGarage = id => garage(id)?.nom ?? "—";
const nomChauffeur = id => D.chauffeurs.find(c=>c.id===id)?.nom ?? "—";
const coutPanne = p => (Number(p.cout_pieces)||0) + (Number(p.cout_mo)||0);

function chauffeurDe(camionId, date){
  date = date || auj();
  let r=null;
  for(const a of D.affectations){
    if(a.camion_id!==camionId || a.debut>date) continue;
    if(a.fin && a.fin<date) continue;
    if(!r || a.debut>r.debut) r=a;
  }
  return r ? D.chauffeurs.find(c=>c.id===r.chauffeur_id) : null;
}

async function charger(){
  const [cam,ch,ga,af,ty,pa,mv,pr,me] = await Promise.all([
    sb.from("sb2_camions").select("*").order("nom"),
    sb.from("sb2_chauffeurs").select("*").order("nom"),
    sb.from("sb2_garages").select("*").order("nom"),
    sb.from("sb2_affectations").select("*"),
    sb.from("sb2_types").select("*").order("ordre"),
    sb.from("sb2_pannes").select("*").order("date_signalement",{ascending:false}),
    sb.from("sb2_mouvements").select("*").order("date",{ascending:false}),
    sb.from("sb2_prefs").select("*").maybeSingle(),
    sb.from("sb2_medias").select("*")
  ]);
  const err = [cam,ch,ga,af,ty,pa,mv,me].find(r=>r.error);
  if(err) throw new Error(err.error.message);
  D = {
    camions:cam.data||[], chauffeurs:ch.data||[], garages:ga.data||[],
    affectations:af.data||[], types:(ty.data||[]).map(t=>t.libelle),
    pannes:pa.data||[], mouvements:mv.data||[], medias:me.data||[],
    prefs: pr.data || {seuil:10000, fenetre_retour:30, delai_alerte_h:2, entreprise:"ETS DSN"}
  };
  try{ localStorage.setItem(CACHE, JSON.stringify(D)); }catch(e){}
}
function chargerCache(){
  try{ const t=localStorage.getItem(CACHE); if(t){ D=JSON.parse(t); return true; } }catch(e){}
  return false;
}

/* --- caisse, calculée localement pour rester réactive --- */
function caisse(){
  let rec=0,dg=0,ouv=0,rep=0,ext=0;
  for(const m of D.mouvements){
    const v=Number(m.montant)||0;
    if(m.sens==="entree"){ if(m.source==="dg") dg+=v; else if(m.source==="ouverture") ouv+=v; else rec+=v; }
    else { if(m.nature==="flotte") rep+=v; else ext+=v; }
  }
  const solde=rec+dg+ouv-rep-ext;
  const partFlotte=Math.max(0,dg-rep);
  const terminees=D.pannes.filter(p=>p.statut==="terminee");
  const engage=terminees.reduce((s,p)=>s+(Number(p.estimation)||0),0);
  const sansEst=terminees.filter(p=>p.estimation===null||p.estimation===undefined).length;
  return { solde, recettes:rec, dg, ouverture:ouv, reparations:rep, externes:ext,
    partFlotte, partLibre:solde-partFlotte, engage, nbARegler:terminees.length,
    sansEstimation:sansEst, previsionnel:solde-engage,
    seuil:Number(D.prefs.seuil)||0, sousSeuil:solde<=(Number(D.prefs.seuil)||0),
    libreNegatif:(solde-partFlotte)<0 };
}
function referenceSablier(){
  const ms=[...D.mouvements].sort((a,b)=>a.date.localeCompare(b.date));
  const limite=ajoutJours(auj(),-120); let cum=0,haut=0;
  for(const m of ms){ cum += (m.sens==="entree"?1:-1)*(Number(m.montant)||0);
    if(m.date>=limite && cum>haut) haut=cum; }
  return Math.max(haut, caisse().solde, (Number(D.prefs.seuil)||0)*3, 1);
}
function recetteJour(camionId){
  let total=0; const dates={};
  for(const m of D.mouvements)
    if(m.sens==="entree" && m.source==="recette" && m.camion_id===camionId){
      total+=Number(m.montant)||0; dates[m.date]=1;
    }
  const n=Object.keys(dates).length;
  return n ? total/(n*5) : 0;
}
const joursArret = p => (p.immobilise && p.immob_debut) ? joursOuvres(p.immob_debut, p.immob_fin) : 0;

function bilanCamion(id, d1, d2){
  let recette=0,pieces=0,mo=0,nbP=0,arret=0;
  for(const m of D.mouvements){
    if(m.sens!=="entree"||m.source!=="recette"||m.camion_id!==id) continue;
    if(d1&&m.date<d1) continue; if(d2&&m.date>d2) continue;
    recette+=Number(m.montant)||0;
  }
  for(const p of D.pannes){
    if(p.camion_id!==id || p.statut!=="payee") continue;
    const d=p.date_paiement;
    if(d1&&d<d1) continue; if(d2&&d>d2) continue;
    pieces+=Number(p.cout_pieces)||0; mo+=Number(p.cout_mo)||0; nbP++; arret+=joursArret(p);
  }
  const rj=recetteJour(id), manque=arret*rj;
  return { recette,pieces,mo,reparations:pieces+mo,nbPannes:nbP,arret,recetteJour:rj,manque,
    coutReel:pieces+mo+manque, net:recette-(pieces+mo+manque) };
}
function aLache(p){
  if(!p.piece||p.statut!=="payee") return null;
  const np=normPiece(p.piece), dp=p.date_paiement; let best=null;
  for(const q of D.pannes){
    if(q.id===p.id||q.camion_id!==p.camion_id||normPiece(q.piece)!==np) continue;
    const dq=q.date_paiement||q.date_signalement.slice(0,10);
    if(dq<=dp) continue;
    const e=jrs(dp,dq);
    if(e<=(D.prefs.fenetre_retour||30) && (!best||e<best.ecart)) best={panne:q,ecart:e};
  }
  return best;
}
function estRetour(p){
  if(!p.piece) return null;
  const np=normPiece(p.piece), dp=p.date_paiement||p.date_signalement.slice(0,10); let best=null;
  for(const q of D.pannes){
    if(q.id===p.id||q.camion_id!==p.camion_id||normPiece(q.piece)!==np||q.statut!=="payee") continue;
    const dq=q.date_paiement;
    if(dq>=dp) continue;
    const e=jrs(dq,dp);
    if(e<=(D.prefs.fenetre_retour||30) && (!best||e<best.ecart)) best={panne:q,ecart:e};
  }
  return best;
}
function perfGarage(id){
  const inters=D.pannes.filter(p=>p.garage_id===id && p.statut==="payee");
  let pieces=0,mo=0,retours=0;
  for(const p of inters){ pieces+=Number(p.cout_pieces)||0; mo+=Number(p.cout_mo)||0; if(aLache(p)) retours++; }
  const n=inters.length, total=pieces+mo;
  return { nb:n,pieces,mo,total,moyen:n?total/n:0,retours,taux:n?retours/n*100:0,partMO:total?mo/total*100:0 };
}
function estimer(camionId, garageId, piece){
  const payees=D.pannes.filter(p=>p.statut==="payee");
  const moy = arr => arr.length ? Math.round(arr.reduce((s,p)=>s+coutPanne(p),0)/arr.length) : null;
  if(piece && garageId){
    const v=moy(payees.filter(p=>p.garage_id===garageId && normPiece(p.piece)===normPiece(piece)));
    if(v!==null) return v;
  }
  if(piece){
    const v=moy(payees.filter(p=>normPiece(p.piece)===normPiece(piece)));
    if(v!==null) return v;
  }
  const v=moy(payees.filter(p=>p.camion_id===camionId));
  return v!==null ? v : moy(payees);
}
const heuresDepuis = t => (Date.now()-new Date(t).getTime())/3600000;
const enRetard = p => p.statut==="signalee" && heuresDepuis(p.date_signalement) > (D.prefs.delai_alerte_h||2);
const enCours = () => D.pannes.filter(p=>["signalee","affectee","terminee"].includes(p.statut));

function vBord(){
  const c=caisse(), max=referenceSablier();
  const hSolde=Math.max(0,Math.min(100,c.solde/max*100));
  const part = x => c.solde>0 ? Math.max(0,Math.min(100, x/c.solde*100)) : 0;
  const pFlotte=part(Math.min(c.partFlotte,c.solde));
  const pEngage=part(Math.min(c.engage, Math.max(0,c.solde-c.partFlotte)));
  const hSeuil=Math.max(0,Math.min(100,c.seuil/max*100));

  let h = `<div class="sablier-bloc">
    <div class="colonne">
      <div class="remplissage" style="height:${hSolde.toFixed(1)}%">
        <div class="p-libre" style="height:${Math.max(0,100-pFlotte-pEngage).toFixed(1)}%"></div>
        <div class="p-engage" style="height:${pEngage.toFixed(1)}%"></div>
        <div class="p-flotte" style="height:${pFlotte.toFixed(1)}%"></div>
      </div>
      <div class="seuil" style="bottom:${hSeuil.toFixed(1)}%"><span>SEUIL</span></div>
    </div>
    <div class="chiffres">
      <div class="lbl">En caisse</div>
      <div class="gros num">${fmtF(c.solde)}</div>
      ${c.nbARegler ? `<div class="lbl" style="margin-top:9px">Après paiements en attente</div>
        <div class="moyen num">${fmtF(c.previsionnel)}</div>` : ""}
      <div class="repart">
        <div><span class="puce" style="background:var(--sable)"></span>Part libre<b>${fmtF(c.partLibre)}</b></div>
        <div><span class="puce" style="background:var(--vert)"></span>Part flotte<b>${fmtF(c.partFlotte)}</b></div>
        ${c.nbARegler ? `<div style="border-top:1px solid var(--ciment);padding-top:7px"><span class="puce p-engage"></span>dont à régler (${c.nbARegler})<b>${fmtF(c.engage)}</b></div>` : ""}
      </div>
    </div></div>`;

  if(c.sousSeuil) h += `<div class="alerte a-rouge"><div><b>Caisse au seuil</b>
    Il reste ${fmtF(c.solde)}, seuil à ${fmtF(c.seuil)}. C'est le moment de solliciter le DG.</div></div>`;
  if(c.previsionnel<=c.seuil && !c.sousSeuil) h += `<div class="alerte a-ocre"><div><b>Le prévisionnel passe sous le seuil</b>
    Une fois les ${c.nbARegler} réparations terminées réglées, il ne restera que ${fmtF(c.previsionnel)}.</div></div>`;
  if(c.sansEstimation) h += `<div class="alerte a-ocre"><div><b>${c.sansEstimation} réparation${c.sansEstimation>1?"s":""} sans montant estimé</b>
    Aucun historique pour les chiffrer. Ouvre-les pour donner un ordre de grandeur, sinon le prévisionnel est faux.</div></div>`;
  if(c.libreNegatif) h += `<div class="alerte a-ocre"><div><b>Les sorties externes entament la part flotte</b>
    Part libre à ${fmtF(c.partLibre)}.</div></div>`;

  const ec=enCours();
  const aAffecter=ec.filter(p=>p.statut==="signalee");
  const auGarage=ec.filter(p=>p.statut==="affectee");
  const aRegler=ec.filter(p=>p.statut==="terminee");
  const retard=aAffecter.filter(enRetard);

  h += `<div class="etapes">
    <div class="etape${retard.length?" urgent":""}"><div class="n">${aAffecter.length}</div><div class="t">à affecter</div></div>
    <div class="etape"><div class="n">${auGarage.length}</div><div class="t">au garage</div></div>
    <div class="etape"><div class="n">${aRegler.length}</div><div class="t">à régler</div></div>
  </div>`;

  for(const p of retard){
    h += `<div class="alerte a-rouge"><div><b>${esc(nomCamion(p.camion_id))} sans garage depuis ${Math.floor(heuresDepuis(p.date_signalement))} h</b>
      ${esc(p.description||"Sans description")} — signalé par ${esc(nomChauffeur(p.chauffeur_id))}</div></div>`;
  }
  const imm=D.pannes.filter(p=>p.immobilise && !p.immob_fin);
  if(imm.length) h += `<div class="alerte a-rouge"><div><b>${imm.length} camion${imm.length>1?"s":""} immobilisé${imm.length>1?"s":""}</b>` +
    imm.map(p=>`${esc(nomCamion(p.camion_id))} — ${joursArret(p)} j ouvrés d'arrêt`).join("<br>") + `</div></div>`;

  h += `<div class="titre-sec">Pannes en cours</div><div class="carte">`;

  else for(const p of ec) h += lignePanne(p);
  h += `</div>`;

  if(admin()) h += `<div class="duo no-print" style="margin-bottom:9px">
      <button class="btn" onclick="formPanneAdmin()">Noter une panne</button>
      <button class="btn sec" onclick="formSortie()">Dépense externe</button></div>
    <div class="duo no-print"><button class="btn sec" onclick="formApportDG()">Apport du DG</button>
      <button class="btn sec" onclick="aller('vendredi')">Collecte</button></div>`;
  return h;
}

      <span class="num">${fmt(coutPanne(x.p))}</span></div>`;

}

/* ================= 13. RAPPORTS ================= */
function bornes(per,ancre){
  if(per==="semaine"){ const l=lundiDe(ancre);
    return {d1:l,d2:ajoutJours(l,6),titre:"Semaine "+numSemaine(l)+" · "+new Date(l+"T00:00:00").getFullYear()}; }
  const x=new Date(ancre+"T00:00:00");
  if(per==="mois") return {
    d1:new Date(x.getFullYear(),x.getMonth(),1).toISOString().slice(0,10),
    d2:new Date(x.getFullYear(),x.getMonth()+1,0).toISOString().slice(0,10),
    titre:MOIS[x.getMonth()][0].toUpperCase()+MOIS[x.getMonth()].slice(1)+" "+x.getFullYear()};
  return {d1:x.getFullYear()+"-01-01",d2:x.getFullYear()+"-12-31",titre:"Année "+x.getFullYear()};
}
window.decaler = n => {
  const per=etatVue.periode||"semaine";
  const x=new Date((etatVue.ancre||auj())+"T00:00:00");
  if(per==="semaine") x.setDate(x.getDate()+7*n);
  else if(per==="mois") x.setMonth(x.getMonth()+n);
  else x.setFullYear(x.getFullYear()+n);
  etatVue.ancre=x.toISOString().slice(0,10); rendu();
};
function totaux(d1,d2){
  const t={recettes:0,dg:0,ouv:0,pieces:0,mo:0,externes:0,nbPannes:0,prog:0,imp:0};
  for(const m of D.mouvements){
    if(m.date<d1||m.date>d2) continue;
    const v=Number(m.montant)||0;
    if(m.sens==="entree"){ if(m.source==="dg") t.dg+=v; else if(m.source==="ouverture") t.ouv+=v; else t.recettes+=v; }
    else if(m.nature!=="flotte") t.externes+=v;
  }
  for(const p of D.pannes){
    if(p.statut!=="payee"||p.date_paiement<d1||p.date_paiement>d2) continue;
    t.pieces+=Number(p.cout_pieces)||0; t.mo+=Number(p.cout_mo)||0; t.nbPannes++;
    if(p.nature==="programmee") t.prog++; else t.imp++;
  }
  t.flotte=t.pieces+t.mo; t.entrees=t.recettes+t.dg+t.ouv;
  t.sorties=t.flotte+t.externes; t.resultat=t.entrees-t.sorties;
  return t;
}
function blocFlux(t){
  return `<div class="carte">
    <div class="ligne"><div class="lib"><b>Recettes camions</b></div><span class="num">${fmtF(t.recettes)}</span></div>
    <div class="ligne"><div class="lib"><b>Apports du DG</b></div><span class="num">${fmtF(t.dg)}</span></div>
    ${t.ouv?`<div class="ligne"><div class="lib"><b>Solde d'ouverture</b></div><span class="num">${fmtF(t.ouv)}</span></div>`:""}
    <div class="ligne"><div class="lib"><b>Total entrées</b></div><span class="num" style="font-weight:700">${fmtF(t.entrees)}</span></div>
    <div class="ligne"><div class="lib"><b>Flotte — pièces</b></div><span class="num">${fmtF(t.pieces)}</span></div>
    <div class="ligne"><div class="lib"><b>Flotte — main-d'œuvre</b></div><span class="num">${fmtF(t.mo)}</span></div>
    <div class="ligne"><div class="lib"><b>Sous-total flotte</b><small>${t.nbPannes} intervention${t.nbPannes>1?"s":""} · ${t.prog} programmées, ${t.imp} imprévues</small></div>
      <span class="num" style="font-weight:700">${fmtF(t.flotte)}</span></div>
    <div class="ligne"><div class="lib"><b>Dépenses externes</b><small>Hors flotte</small></div><span class="num">${fmtF(t.externes)}</span></div>
    <div class="ligne"><div class="lib"><b>Total sorties</b></div><span class="num" style="font-weight:700">${fmtF(t.sorties)}</span></div>
    <div class="ligne" style="border-bottom:0"><div class="lib"><b>Résultat de la période</b></div>
      <span class="num" style="font-size:19px;font-weight:700;color:${t.resultat<0?"var(--minium)":"var(--vert)"}">${fmtF(t.resultat)}</span></div></div>`;
}
function vRapports(){
  const per=etatVue.periode||"semaine", b=bornes(per,etatVue.ancre||auj());
  let h=`<div class="onglets no-print">${
    [["semaine","Hebdomadaire"],["mois","Mensuel"],["annee","Annuel"]].map(x=>
      `<button class="${per===x[0]?"on":""}" onclick="setVue('periode','${x[0]}')">${x[1]}</button>`).join("")}</div>
    <div class="duo no-print" style="margin-bottom:13px">

    <div class="imprime-entete"><h1>${esc(D.prefs.entreprise)} — Rapport ${{semaine:"hebdomadaire",mois:"mensuel",annee:"annuel"}[per]}</h1>
      <p>${esc(b.titre)} · du ${dateLongue(b.d1)} au ${dateLongue(b.d2)} · édité le ${dateLongue(auj())}</p></div>
    <div class="carte no-print" style="padding:11px 14px"><b>${esc(b.titre)}</b>
      <div class="mt">Du ${dateLongue(b.d1)} au ${dateLongue(b.d2)}</div></div>`;
  const t=totaux(b.d1,b.d2);
  h += `<div class="titre-sec">Où est passé l'argent</div>` + blocFlux(t);

  if(per==="semaine"){
    h+=`<div class="titre-sec">Recettes par camion</div><div class="carte"><div class="scroll-x"><table><thead><tr>
      <th>Camion</th><th>Chauffeur</th><th class="n">Recette</th><th class="n">Réparations</th></tr></thead><tbody>`;
    let vide=true;
    for(const c of D.camions){
      const bb=bilanCamion(c.id,b.d1,b.d2);
      if(!bb.recette&&!bb.reparations) continue;
      vide=false; const ch=chauffeurDe(c.id,b.d2);
      h+=`<tr><td><b>${esc(c.nom)}</b></td><td>${ch?esc(ch.nom):"—"}</td>
        <td class="n">${fmt(bb.recette)}</td><td class="n">${fmt(bb.reparations)}</td></tr>`;
    }
    if(vide) h+=`<tr><td colspan="4" class="mt">Aucun mouvement cette semaine.</td></tr>`;
    h+=`</tbody></table></div></div>`;
    h+=`<div class="titre-sec">Détail des interventions</div>`+tableauPannes(b.d1,b.d2);
    h+=`<div class="titre-sec">Dépenses externes</div>`+tableauExternes(b.d1,b.d2);
  } else {
    h+=`<div class="titre-sec">Quels camions nourrissent, lesquels mangent</div>
      <div class="carte"><div class="scroll-x"><table><thead><tr>
      <th>Camion</th><th class="n">Recette</th><th class="n">Pièces</th><th class="n">MO</th>
      <th class="n">Arrêt</th><th class="n">Manque</th><th class="n">Net</th></tr></thead><tbody>`;
    const l=D.camions.map(c=>({c,b:bilanCamion(c.id,b.d1,b.d2)}))
      .filter(x=>x.b.recette||x.b.reparations).sort((a,z)=>a.b.net-z.b.net);
    if(!l.length) h+=`<tr><td colspan="7" class="mt">Aucun mouvement sur la période.</td></tr>`;
    for(const x of l) h+=`<tr><td><b>${esc(x.c.nom)}</b></td><td class="n">${fmt(x.b.recette)}</td>
      <td class="n">${fmt(x.b.pieces)}</td><td class="n">${fmt(x.b.mo)}</td><td class="n">${x.b.arret||"—"}</td>
      <td class="n">${fmt(x.b.manque)}</td>
      <td class="n" style="font-weight:700;color:${x.b.net<0?"var(--minium)":"var(--vert)"}">${fmt(x.b.net)}</td></tr>`;
    h+=`</tbody></table></div><p class="mt" style="margin-top:10px">Du plus coûteux au plus rentable.</p></div>`;
    h+=`<div class="titre-sec">Dépenses externes</div>`+tableauExternes(b.d1,b.d2);
  }
  return h;
}
function tableauPannes(d1,d2){
  const ps=D.pannes.filter(p=>p.statut==="payee"&&p.date_paiement>=d1&&p.date_paiement<=d2)
    .sort((a,b)=>a.date_paiement.localeCompare(b.date_paiement));
  let h=`<div class="carte"><div class="scroll-x"><table><thead><tr>
    <th>Date</th><th>Camion</th><th>Pièce / type</th><th>Garage</th>
    <th class="n">Pièces</th><th class="n">MO</th><th class="n">Total</th></tr></thead><tbody>`;
  if(!ps.length) h+=`<tr><td colspan="7" class="mt">Aucune intervention.</td></tr>`;
  for(const p of ps) h+=`<tr><td>${dateCourte(p.date_paiement)}</td><td>${esc(nomCamion(p.camion_id))}</td>
    <td>${esc(p.piece||"—")}<br><small class="mt">${esc(p.type)} · ${p.action==="reparee"?"réparée":"changée"}</small></td>
    <td>${esc(nomGarage(p.garage_id))}</td><td class="n">${fmt(p.cout_pieces)}</td>
    <td class="n">${fmt(p.cout_mo)}</td><td class="n" style="font-weight:700">${fmt(coutPanne(p))}</td></tr>`;
  return h+`</tbody></table></div></div>`;
}
function tableauExternes(d1,d2){
  const ms=D.mouvements.filter(m=>m.sens==="sortie"&&m.nature!=="flotte"&&m.date>=d1&&m.date<=d2)
    .sort((a,b)=>a.date.localeCompare(b.date));
  let h=`<div class="carte"><div class="scroll-x"><table><thead><tr>
    <th>Date</th><th>Objet</th><th>Catégorie</th><th class="n">Montant</th></tr></thead><tbody>`;
  if(!ms.length) h+=`<tr><td colspan="4" class="mt">Aucune dépense externe.</td></tr>`;
  let tot=0;
  for(const m of ms){ tot+=Number(m.montant)||0;
    h+=`<tr><td>${dateCourte(m.date)}</td><td>${esc(m.libelle)}</td>
      <td>${esc(m.categorie||"—")}</td><td class="n">${fmt(m.montant)}</td></tr>`; }
  if(ms.length) h+=`<tr><td colspan="3"><b>Total</b></td><td class="n"><b>${fmt(tot)}</b></td></tr>`;
  return h+`</tbody></table></div></div>`;
}

/* ================= 15. DÉMARRAGE ================= */
async function demarrer(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return ecranAccueil();

  const {data,error} = await sb.rpc("sb2_moi");
  if(error){ ecranAccueil(`<div class="alerte a-rouge"><div>${esc(error.message)}</div></div>`); return; }
  moi = Array.isArray(data) ? data[0] : data;

  if(!moi || moi.role==="inconnu") return ecranRattachement();
  if(moi.role==="chauffeur"||moi.role==="garage"){
    document.getElementById("racine").innerHTML =
      `<div id="accueil"><div class="marque-g">SABLIER</div>
       <div class="sous">${esc(moi.nom)}</div>
       <div class="carte"><div class="vide"><b>Écran en préparation</b>
       L'interface ${esc(moi.role)} arrive très bientôt.</div>
       <button class="btn" style="width:100%" onclick="location.reload()">Actualiser</button></div></div>`;
    return;
  }

  charpente();
  try{ await charger(); }
  catch(e){
    if(chargerCache()) toast("Hors ligne — dernières données connues.");
    else { document.getElementById("main").innerHTML =
      `<div class="alerte a-rouge"><div><b>Chargement impossible</b>${esc(e.message)}</div></div>`; return; }
  }
  rendu();
}

window.addEventListener("online", ()=>{ enLigne=true; recharger().catch(()=>{}); });
window.addEventListener("offline", ()=>{ enLigne=false; if(D) bandeaux(); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && moi && D) recharger().catch(()=>{}); });

/* Accès par lien personnel : ?a=JETON
   Une fonction serveur vérifie le jeton et ouvre une vraie session.
   Le même lien mène toujours au même compte, sur n'importe quel appareil. */
async function ouvrirParLien(jeton){
  const r = await fetch(SB_URL + "/functions/v1/acces-flotte", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":SB_CLE, "Authorization":"Bearer "+SB_CLE },
    body: JSON.stringify({ jeton })
  });
  if(!r.ok) throw new Error(r.status === 401 ? "JETON_INVALIDE" : "SERVEUR");
  const d = await r.json();
  const { error } = await sb.auth.setSession({
    access_token:d.access_token, refresh_token:d.refresh_token });
  if(error) throw new Error("SESSION");
  return d;
}
function echecLien(cause){
  const quoi = cause === "JETON_INVALIDE"
    ? "Ce lien n'est plus valable. Demande-en un nouveau à SARANA."
    : "Impossible de joindre le serveur. Vérifie ta connexion et rouvre le lien.";
  document.getElementById("racine").innerHTML =
    `<div id="accueil"><div class="marque-g">SABLIER</div>
     <div class="alerte a-rouge"><div><b>Accès impossible</b>${esc(quoi)}</div></div>
     <button class="btn" style="width:100%" onclick="location.reload()">Réessayer</button></div>`;
}

(async function(){
  const jeton = new URLSearchParams(location.search).get("a");
  if(jeton){
    document.getElementById("racine").innerHTML =
      `<div id="accueil"><div class="marque-g">SABLIER</div>
       <div class="sous">Ouverture de votre accès…</div></div>`;
    try{ await ouvrirParLien(jeton); }
    catch(e){ return echecLien(e.message); }
    /* purement cosmétique : ne doit jamais empêcher l'accès */
    try{ history.replaceState({},"",location.pathname); }catch(e){}
  }
  demarrer();
})();
</script>
